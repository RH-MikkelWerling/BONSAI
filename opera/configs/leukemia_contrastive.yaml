# ══════════════════════════════════════════════════════════════════════
# OPERA Multi-Cohort Contrastive Training — Leukemia Registry
# ══════════════════════════════════════════════════════════════════════
#
# Training uses `cohort_grouped` (11 broad disease groups) to maximise
# cross-disease contrastive signal.  Evaluation then breaks out by
# `cohort_fine` (25 analyzed diagnoses; EXCLUDE_SECONDARY is an explicit
# non-analyzed label) via the leukemia_sweep config.
#
# Disease groups and their fine sub-diagnoses:
#   DLBCL_like      : DLBCL, BCL, RT, RT_DERIVED
#   Indolent_B_NHL  : FL, MCL, LPL, EMZL, NMZL, SMZL, TRANSFORMED_FL
#   T_NHL           : AITL, ALCL, PTCL, TCL
#   CLL_SLL         : CLL, SLL
#   BL_LBL          : BL, LBL
#   MM              : MM, PCL
#   HL, HCL, AMYLOIDOSIS, SoIM, EXCLUDE_SECONDARY  (1:1)
#
# Usage:
#   python -m opera.run.contrastive_multicohort \
#       --config-name leukemia_contrastive \
#       dapt_ckpt=/path/to/dapt/best.ckpt
# ══════════════════════════════════════════════════════════════════════

defaults:
  - /core/base_train@
  - /hardware/1gpu6cpu@hardware
  - _self_

hydra:
  searchpath:
    - file://${oc.env:BONSAI_CONFIG_PATH}

dataset: leukemia_multicohort   # used by base_train.yaml hydra.run.dir interpolation

dapt_ckpt: ???
dapt_embedding_store: null    # path to pre-computed DAPT .pt store, or null

paths:
  # Override vocab_cohort on the CLI if this cohort directory is absent.
  vocab_cohort: dlbcl_like
  vocabulary: ${oc.env:BONSAI_PROCESSED_DATA}/${paths.vocab_cohort}/vocabulary.pt

cohort_scope:
  name: null
  general_pretraining: frozen
  adaptation_cohorts: []
  finetune_cohort: null

# ── Disease cohorts (grouped level for training) ─────────────────────
# Each cohort needs subject_data_train.pt / subject_data_tuning.pt
# and an outcomes/ subdirectory.
#
# BONSAI_PROCESSED_DATA is expected to be organised as:
#   ${BONSAI_PROCESSED_DATA}/dlbcl_like/   ← DLBCL_like grouped data
#   ${BONSAI_PROCESSED_DATA}/indolent_b_nhl/
#   … etc.
cohorts:
  dlbcl_like:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/dlbcl_like
    registry_start_date: null
  indolent_b_nhl:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/indolent_b_nhl
    registry_start_date: null
  t_nhl:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/t_nhl
    registry_start_date: null
  cll_sll:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/cll_sll
    registry_start_date: null
  bl_lbl:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/bl_lbl
    registry_start_date: null
  mm:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/mm
    registry_start_date: null
  hl:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/hl
    registry_start_date: null
  hcl:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/hcl
    registry_start_date: null
  amyloidosis:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/amyloidosis
    registry_start_date: null
  soim:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/soim
    registry_start_date: null
  # EXCLUDE_SECONDARY is intentionally omitted from contrastive training
  # as its label meaning (secondary malignancy) differs from the primary
  # disease cohorts used for outcome-guided learning.

# ── Outcomes (shared across cohorts where parquet exists) ───────────
# outcome_file: source event-time parquet inside each cohort's outcomes/ dir.
outcomes:
  mortality_1y:
    outcome_file: mortality.parquet
    eligibility_file: mortality__audit.parquet
    n_hours_start_include: 1
    n_hours_end_include: 8760
  mortality_2y:
    outcome_file: mortality.parquet
    eligibility_file: mortality__audit.parquet
    n_hours_start_include: 1
    n_hours_end_include: 17520
  treatment_failure:
    outcome_file: treatment_failure.parquet
    eligibility_file: treatment_failure__audit.parquet
    n_hours_start_include: 1
    n_hours_end_include: null
  aki_30d:
    outcome_file: aki_first_documented.parquet
    eligibility_file: aki_first_documented__audit.parquet
    competing_outcome_file: mortality.parquet
    n_hours_start_include: 1
    n_hours_end_include: 720
  severe_infection_90d:
    outcome_file: severe_infection.parquet
    eligibility_file: severe_infection__audit.parquet
    competing_outcome_file: mortality.parquet
    n_hours_start_include: 1
    n_hours_end_include: 2160

model:
  projection_hidden_dim: 256
  projection_dim: 128
  temperature: 0.07
  km_time_scale: 0.25      # quantile-space kernel bandwidth: exp(-|q_i-q_j|/scale)
  dapt_lambda_floor: 0.3
  dapt_anchor_weight: 0.0
  competing_event_handling: hard_negative
  competing_event_weight: 0.0
  effective_pair_normalization: true
  freeze_encoder: false
  pooling: cls_last

cross_outcome:
  # Uniform is the primary setting for the full adverse-event panel.
  weighter: uniform
  aggregation: macro
  class_balanced: false
  class_balanced_cap: 50.0
  class_balanced_beta: 0.9999
  class_counts: {}

training:
  require_all_configured_cells: true
  batch_size: 128
  batch_sampling:
    type: event_aware
    min_events_per_batch: 4
    min_valid_per_batch: 32
    n_quantiles: 4
    seed: 0
  accumulate_grad_batches: 2
  epochs: 20
  learning_rate: 5e-5
  encoder_lr_multiplier: 0.1
  optimizer_epsilon: 1e-6
  scheduler_warmup_epochs: 2
  limit_val_batches: 1.0
  limit_train_batches: 1.0
