# Closest available endpoints, not exact replications of original scores.
# Diagnosis-time scoring confirmed by the author, 2026-11-09; individual dates unavailable.
availability:
  cohort_column: cohort_fine
  index_column: index
  group_column: IPI
all_indices:
  index_column: index
  cohort_column: cohort_fine
  minimum_patients: 1
  pooled: true
  per_cohort: false
  manuscript: {}
  template:
    model: J_OA_OWN_L
    seed: 42
    outcome: overall_survival
    outcome_label: Overall survival
    horizon_days: 365
    death_in_endpoint: true
    group_column: IPI
    group_map: &id001
      low: Low
      low risk: Low
      low-risk: Low
      medium: Intermediate
      medium risk: Intermediate
      intermediate: Intermediate
      intermediate risk: Intermediate
      intermediate-risk: Intermediate
      moderate: Intermediate
      low intermediate: Low-intermediate
      low-intermediate: Low-intermediate
      low intermediate risk: Low-intermediate
      low-intermediate risk: Low-intermediate
      high intermediate: High-intermediate
      high-intermediate: High-intermediate
      high intermediate risk: High-intermediate
      high-intermediate risk: High-intermediate
      high: High
      high risk: High
      high-risk: High
      very high: Very high
      very high risk: Very high
      very-high: Very high
    group_order:
    - Low
    - Intermediate
    - High
    score_high_group: High
    age_column: age_at_index
    score_date_column: null
    score_timing: Scored at diagnosis (confirmed by the study author, 2026-11-09);
      evaluated as diagnostic information at first-line treatment start. Individual
      score dates are not supplied for a per-patient timing audit.
    cutoff_rule: cohort_size_matched
    comparison_bootstrap: 1000
    threshold_split: train
    minimum_patients: 50
    lock_provenance: Endpoint and time-horizon choices specified before held-out clinical
      comparisons, 2026-11-09. Equal-size grouping is outcome-blind; evaluation-KM
      matching is separately descriptive with paired boundary reselection.
    applicability_review: Descriptive comparison restricted to patients with this
      recorded index; not a claim of validated use in other diseases
    evaluation_time_origin: First-line treatment start in the frozen OPERA cohort,
      not necessarily the original index development time origin.
    original_horizon_note: One-year primary evaluation; original studies commonly
      evaluated longer horizons. The separate NCCN treatment-failure comparison remains
      two-year.
    time_origin_match: not_assumed_identical
    score_timing_verified: false
    score_timing_confirmation: Study-author confirmation of diagnosis-time scoring,
      2026-11-09.
    assessment_time: diagnosis
    assessment_time_confirmed: true
  overrides:
    CLL-IPI:
      group_map: *id001
      group_order:
      - Low
      - Intermediate
      - High
      - Very high
      score_high_group: Very high
    FLIPI2:
      group_map: *id001
      group_order:
      - Low
      - Intermediate
      - High
    IPS:
      group_map: *id001
      group_order:
      - Low
      - High
    IPSSWM:
      group_map: *id001
      group_order:
      - Low
      - Intermediate
      - High
    MALT-IPI:
      group_map: *id001
      group_order:
      - Low
      - Intermediate
      - High
    MIPI:
      group_map: *id001
      group_order:
      - Low
      - Intermediate
      - High
    R-IPI:
      group_map: *id001
      group_order:
      - Low
      - Intermediate
      - High
    R-ISS:
      group_map: *id001
      group_order:
      - Low
      - Intermediate
      - High
