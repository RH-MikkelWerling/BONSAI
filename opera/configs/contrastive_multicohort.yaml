# ══════════════════════════════════════════════════════════════════════
# OPERA Multi-Cohort Contrastive Training Config
# ══════════════════════════════════════════════════════════════════════
#
# Add a block per disease cohort under `cohorts`.
# Add a block per outcome under `outcomes` — missing parquets are
# treated as errors for every configured cohort in production mode. Use a separate
# reduced config for outcomes that are intentionally unavailable in a cohort.
#
# Usage:
#   python -m opera.run.contrastive_multicohort \
#       dapt_ckpt=/path/to/dapt/best.ckpt \
#       dapt_embedding_store=/path/to/dapt_embeddings.pt   # optional
# ══════════════════════════════════════════════════════════════════════

defaults:
  - /core/base_train@
  - /hardware/1gpu6cpu@hardware
  - _self_

hydra:
  searchpath:
    - file://${oc.env:BONSAI_CONFIG_PATH}

dataset: multicohort   # used by base_train.yaml hydra.run.dir interpolation

dapt_ckpt: ???
dapt_embedding_store: null    # path to pre-computed DAPT .pt store, or null

paths:
  # Override vocab_cohort on the CLI if the default cohort is not present.
  vocab_cohort: dlbcl
  vocabulary: ${oc.env:BONSAI_PROCESSED_DATA}/${paths.vocab_cohort}/vocabulary.pt

cohort_scope:
  name: null
  general_pretraining: frozen
  adaptation_cohorts: []
  finetune_cohort: null

# ── Disease cohorts ──────────────────────────────────────────────────
# Each cohort needs subject_data_train.pt / subject_data_tuning.pt
# and an outcomes/ subdirectory.
cohorts:
  dlbcl:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/dlbcl
    registry_start_date: null
  cll:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/cll
    registry_start_date: null
  mds:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/mds
    registry_start_date: null
  myeloma:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/myeloma
    registry_start_date: null
  fl:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/fl
    registry_start_date: null

# ── Outcomes (shared across cohorts where parquet exists) ───────────
# outcome_file: source event-time parquet inside each cohort's outcomes/ dir.
# Multiple task windows can reuse the same source file.
outcomes:
  mortality_1y:
    outcome_file: mortality.parquet
    eligibility_file: mortality__audit.parquet
    n_hours_start_include: 1
    n_hours_end_include: 8760
  mortality_2y:
    outcome_file: mortality.parquet
    eligibility_file: mortality__audit.parquet
    n_hours_start_include: 1
    n_hours_end_include: 17520
  treatment_failure:
    outcome_file: treatment_failure.parquet
    eligibility_file: treatment_failure__audit.parquet
    n_hours_start_include: 1
    n_hours_end_include: null
  aki_30d:
    outcome_file: aki_first_documented.parquet
    eligibility_file: aki_first_documented__audit.parquet
    competing_outcome_file: mortality.parquet
    n_hours_start_include: 1
    n_hours_end_include: 720
  severe_infection_90d:
    outcome_file: severe_infection.parquet
    eligibility_file: severe_infection__audit.parquet
    competing_outcome_file: mortality.parquet
    n_hours_start_include: 1
    n_hours_end_include: 2160
  # adverse_events_90d:
  #   outcome_file: adverse_events.parquet
  #   n_hours_start_include: 1
  #   n_hours_end_include: 2160

model:
  projection_hidden_dim: 256
  projection_dim: 128
  temperature: 0.07
  km_time_scale: 0.25      # quantile-space kernel bandwidth: exp(-|q_i-q_j|/scale)
  # Time similarity is computed on pooled Kaplan-Meier cumulative event-mass
  # positions, not raw time or unweighted empirical CDF ranks.
  # DAPT cosine similarity modulates outcome/time/censoring pair weights.
  # 1.0 disables the DAPT prior ablation; lower values give the prior more say.
  # Both mechanisms require dapt_embedding_store to be populated (see
  # opera.run.build_dapt_embedding_store) — null store makes both no-ops
  # regardless of these values. 0.55/0.2 are informed starting points, not
  # validated: chosen to limit how much clinical-similarity gating can
  # discount rare/unusual (DAPT-embedding-outlier) patients' pair weight,
  # pending the ablation documented in OPERA_EXPERIMENTS.md.
  dapt_lambda_floor: 0.55
  # Optional cosine anchor on pre-projection pooled encoder states.
  dapt_anchor_weight: 0.2
  # Competing deaths default to hard negatives: event-free up to death time.
  # Set handling=censor with weight=0.0 to reproduce the older behavior.
  competing_event_handling: hard_negative
  competing_event_weight: 0.0
  # Normalize sigma/loss by effective informative pairs across each outcome.
  effective_pair_normalization: true
  freeze_encoder: false
  pooling: cls_last

cross_outcome:
  # Uniform avoids learned task suppression in the primary representation run.
  # Kendall and FAMO are available as one-field confound-panel alternatives.
  weighter: uniform
  aggregation: macro
  class_balanced: false
  class_balanced_cap: 50.0
  class_balanced_beta: 0.9999
  class_counts: {}

training:
  require_all_configured_cells: true
  batch_size: 128               # larger = more cross-disease pairs per step
  batch_sampling:
    type: event_aware
    min_events_per_batch: 4
    min_valid_per_batch: 32
    min_unique_events_for_focus: 1
    min_unique_valid_for_focus: 8
    n_quantiles: 4
    seed: 0
  accumulate_grad_batches: 2
  epochs: 20
  learning_rate: 5e-5
  encoder_lr_multiplier: 0.1
  optimizer_epsilon: 1e-6
  scheduler_warmup_epochs: 2
  limit_val_batches: 1.0
  limit_train_batches: 1.0
