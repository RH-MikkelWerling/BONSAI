defaults: 
  - /core/base_train@
  - /hardware/1gpu6cpu@hardware
  - _self_

hydra:
  searchpath:
    - file://${oc.env:BONSAI_CONFIG_PATH}

dapt_ckpt: ???   # path to DAPT (or base pretrain) checkpoint
dataset: ???

paths:
  dir: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}
  train_split: ${paths.dir}/subject_data_train.pt
  val_split: ${paths.dir}/subject_data_tuning.pt
  subject_data_paths:
    - ${paths.train_split}
    - ${paths.val_split}
  vocabulary: ${paths.dir}/vocabulary.pt
  population: ${paths.dir}/population_full.csv

# ── Outcomes ──────────────────────────────────────────────────────────
# Same format as contrastive.yaml — add one block per outcome.
outcomes:
  treatment_failure:
    path: ${paths.dir}/outcomes/treatment_failure.parquet
    eligibility_file: treatment_failure__audit.parquet
    n_hours_start_include: 1
    n_hours_end_include: null
    registry_start_date: null
  mortality_1y:
    path: ${paths.dir}/outcomes/mortality.parquet
    eligibility_file: mortality__audit.parquet
    n_hours_start_include: 1
    n_hours_end_include: 8760
    registry_start_date: null
  mortality_2y:
    path: ${paths.dir}/outcomes/mortality.parquet
    eligibility_file: mortality__audit.parquet
    n_hours_start_include: 1
    n_hours_end_include: 17520
    registry_start_date: null
  aki_30d:
    path: ${paths.dir}/outcomes/aki_first_documented.parquet
    eligibility_file: aki_first_documented__audit.parquet
    competing_outcome_path: ${paths.dir}/outcomes/mortality.parquet
    n_hours_start_include: 1
    n_hours_end_include: 720
    registry_start_date: null
  severe_infection_90d:
    path: ${paths.dir}/outcomes/severe_infection.parquet
    eligibility_file: severe_infection__audit.parquet
    competing_outcome_path: ${paths.dir}/outcomes/mortality.parquet
    n_hours_start_include: 1
    n_hours_end_include: 2160
    registry_start_date: null

model:
  head_hidden_dim: 128          # TUNE: per-outcome head MLP width
  head_dropout: 0.1
  freeze_encoder: false         # TUNE: true → only train heads
  pooling: cls_last             # "cls_last" or "bigru"

  # ── Loss weighting ─────────────────────────────────────────────
  # "equal"   — unweighted mean of per-outcome BCEs (default, recommended)
  # "fixed"   — user-specified per-outcome weights (set fixed_weights below)
  # "kendall" — learned log-variance (Kendall 2018); opt-in ablation ONLY
  #
  # Use "equal" for the main MOL baseline experiment.
  # Use "kendall" only if you want the ablation that isolates SupCon-vs-BCE
  # while controlling for the weighting mechanism.
  weighting: equal

  # Only used when weighting=fixed.  Keys must match outcome names above.
  # fixed_weights:
  #   treatment_failure: 1.0
  #   mortality: 0.5
  #   relapse: 0.8

training:
  batch_size: 64
  accumulate_grad_batches: 2
  epochs: 20
  learning_rate: 5e-5
  encoder_lr_multiplier: 0.1   # encoder LR = learning_rate * this
  optimizer_epsilon: 1e-6
  scheduler_warmup_epochs: 2
  early_stopping_patience: 5
  limit_val_batches: 1.0
  limit_train_batches: 1.0
