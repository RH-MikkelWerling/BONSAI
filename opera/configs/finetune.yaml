defaults: 
  - /core/base_train@
  - /hardware/1gpu6cpu@hardware
  - _self_

hydra:
  searchpath:
    - file://${oc.env:BONSAI_CONFIG_PATH}

encoder_ckpt: ???         # path to pretrain / DAPT / contrastive checkpoint
encoder_source: contrastive   # "pretrain" | "dapt" | "contrastive" | "random_init"
dataset: ???
outcome: ???
training_stage: per_task_finetuning

cohort_scope:
  name: null
  general_pretraining: frozen
  adaptation_cohorts: []
  finetune_cohort: null

paths:
  dir: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}
  train_split: ${paths.dir}/subject_data_train.pt
  val_split: ${paths.dir}/subject_data_tuning.pt
  # Physical ehr2meds SSL partitions are pooled before outcome-defined OOT
  # train/tuning/held-out selection. The legacy split paths remain fallbacks.
  subject_data_paths:
    - ${paths.train_split}
    - ${paths.val_split}
  vocabulary: ${paths.dir}/vocabulary.pt
  population: ${paths.dir}/population_full.csv
  outcome: ${paths.dir}/outcomes/${outcome}.parquet
  competing_outcome: null
  eligibility: null

labels:
  train_key: train
  val_key: tuning
  test_key: held_out
  n_hours_start_include: 1
  n_hours_end_include: null
  registry_start_date: null
  require_min_followup_train: true
  require_min_followup_val: true
  require_min_followup_test: true

model:
  # Architecture params are inherited from the encoder checkpoint when one is
  # supplied. For encoder_source=random_init, these fields define the model.
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  max_seqlen: 8192
  bias: false
  dropout: 0.1
  attention_dropout: 0.0
  causal: true
  attn_type: flash
  value_bin_vocab_size: 0
  value_embedding_mode: legacy
  freeze_encoder: false
  head_type: finetune_head
  trainable_prefixes: null

training:
  max_len: ${model.max_seqlen}
  batch_size: 32
  accumulate_grad_batches: 1
  epochs: 20
  learning_rate: 5e-4
  optimizer_epsilon: 1e-6
  scheduler_warmup_epochs: 1
  sampling_weight_fn: null
  loss_weight_function: null
  eval_monitor_metric: val/AUROC
  early_stopping_patience: 5
  limit_val_batches: 1.0
  limit_train_batches: 1.0
