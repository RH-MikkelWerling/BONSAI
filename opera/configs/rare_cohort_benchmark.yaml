# Real rare disease / small cohort-outcome benchmark.
#
# This is separate from synthetic label-efficiency experiments. `rarity_mode:
# real` means the task is genuinely small before any artificial subsampling.

output_dir: ${BONSAI_RESULTS_ROOT}/opera_real_rarity
baseline_model: tabular_ehr
rarity_mode: real

size_bins:
  n_train: [0, 25, 50, 100, 250, 500]

tasks:
  # Confirm these cells against the locked event-count table before paper use.
  - cohort: mds
    outcome: aki_30d
    outcome_file: aki_first_documented.parquet
    eligibility_file: aki_first_documented__audit.parquet
    competing_outcome_file: mortality.parquet
    data_dir: ${BONSAI_PROCESSED_DATA}/mds
    rarity_tier: small_cohort_outcome_cell
    n_hours_start_include: 1
    n_hours_end_include: 720

  - cohort: fl
    outcome: severe_infection_90d
    outcome_file: severe_infection.parquet
    eligibility_file: severe_infection__audit.parquet
    competing_outcome_file: mortality.parquet
    data_dir: ${BONSAI_PROCESSED_DATA}/fl
    rarity_tier: small_cohort_outcome_cell
    n_hours_start_include: 1
    n_hours_end_include: 2160

model_variants:
  tabular_ehr:
    predictions_file: ${BONSAI_RESULTS_ROOT}/tabular/tabular_ehr_{cohort}_{outcome}_predictions.csv
  opera:
    encoder_ckpt: ${BONSAI_CHECKPOINT_ROOT}/contrastive/best.ckpt
    encoder_source: contrastive
  opera_joint:
    encoder_ckpt: ${BONSAI_CHECKPOINT_ROOT}/joint_finetune/best.ckpt
    encoder_source: joint
