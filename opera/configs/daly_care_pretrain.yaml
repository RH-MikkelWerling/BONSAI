# DALY-CARE-only pretraining from scratch.
#
# This is the clean ablation for the staged ladder:
#   base_pretrain -> daly_care_pretrain -> DAPT -> OPERA per-cohort
#   -> OPERA joint -> joint finetune.
#
# Run with the OPERA wrapper around the BONSAI pretraining machinery:
#   python -m opera.run.daly_care_pretrain

dataset: daly_care
training_stage: daly_care_only_pretraining
overwrite: false

hydra:
  verbose: false
  output_subdir: hydra
  run:
    dir: ${oc.env:BONSAI_MODELS}/${dataset}/${hydra:job.config_name}
  sweep:
    dir: ${oc.env:BONSAI_MODELS}/${dataset}
    subdir: ${hydra:job.config_name}

hardware:
  accelerator: "auto"
  num_nodes: 1
  num_devices: 1
  num_workers: 6
  # The available V100 supports FP16 but not BF16. This is an operational
  # hardware difference from the collaborators' A100 runs, not a model change.
  precision: "16-mixed"
  strategy: "auto"
  compile_mode: null

paths:
  dir: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}
  train_split: ${paths.dir}/subject_data_train.pt
  val_split: ${paths.dir}/subject_data_tuning.pt
  vocab: ${paths.dir}/vocabulary.pt
  dataset_class: bonsai.modules.datasets.PretrainDataset.ARPretrainDataset
  population: ${paths.dir}/population_full.csv
  ckpt_path: null

model:
  # Match the collaborator general-population BONSAI architecture so the
  # pretraining population, rather than model capacity, defines the contrast.
  hidden_size: 64
  num_layers: 4
  num_attention_heads: 4
  max_seqlen: 3372
  bias: false
  dropout: 0.1
  attention_dropout: 0.0
  causal: true
  attn_type: sdpa
  # ehr2meds joined lab-bin suffixes enter through the ordinary code vocabulary.
  value_bin_vocab_size: 0
  value_embedding_mode: legacy

training:
  # Exclusive calendar boundary: neither SSL training nor validation sees
  # events at or after 2022-01-01.
  cutoff_date:
    year: 2022
    month: 1
    day: 1
  max_len: ${model.max_seqlen}
  truncation_strategy: tail
  validation_truncation_strategy: tail
  tail_window_probability: 1.0
  batch_size: 128
  accumulate_grad_batches: 1
  epochs: 10
  learning_rate: 3e-4
  optimizer_epsilon: 1e-6
  scheduler_warmup_epochs: 0.1
  value_regression_loss_weight: 0.0
  limit_val_batches: 1.0
  limit_train_batches: 1.0
