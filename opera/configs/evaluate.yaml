defaults:
  - _self_

run_dir: ???
ckpt_path: null  # explicit override; default is ${run_dir}/best.ckpt
dataset: ???
outcome: ???
outcome_name: null
output_dir: ???
model_family: null
training_stage: evaluation
encoder_frozen: null
head_type: null
max_len: null

device: auto    # "cuda", "cpu", or "auto"
# auto uses SDPA on CPU and the checkpoint's backend on CUDA. Set explicitly
# to "flash" or "sdpa" to override checkpoint metadata.
attention_backend: auto
batch_size: 64
num_workers: 4
threshold: 0.5
n_bootstrap: 1000
strict_checkpoint_load: true

# Optional within-cohort survival discrimination. Disabled by default so
# existing evaluation rows and artifacts remain unchanged.
stratified_concordance:
  enabled: false
  strata_col: cohort_fine
  n_bootstrap: null  # null reuses the top-level n_bootstrap value
  min_events: 10

paths:
  dir: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}
  test_split: ${paths.dir}/subject_data_held_out.pt
  vocabulary: ${paths.dir}/vocabulary.pt
  population: ${paths.dir}/population_full.csv
  outcome: ${paths.dir}/outcomes/${outcome}.parquet
  competing_outcome: null
  eligibility: null
  subgroups: null

# Fine-cohort subsetting (train-on-grouped / eval-on-fine paradigm).
# When both fields are set, only test subjects whose `cohort_fine_col`
# column in the population CSV equals `cohort_fine_value` are evaluated.
# Leave both null for ordinary (full-cohort) evaluation.
cohort_fine_col: null
cohort_fine_value: null

subgroups:
  columns: []

rarity:
  # none = ordinary evaluation, synthetic = label-scarcity subsampling,
  # real = genuinely small disease cohort or cohort-outcome cell.
  mode: none
  tier: null
  baseline_model: null
  size_metadata:
    n_train: null
    n_val: null
    n_test: null
    n_events_train: null
    n_events_val: null
    n_events_test: null
    prevalence_train: null
    prevalence_val: null
    prevalence_test: null

labels:
  train_key: train
  val_key: tuning
  test_key: held_out
  n_hours_start_include: 1
  n_hours_end_include: null
  registry_start_date: null
  require_min_followup_test: true
