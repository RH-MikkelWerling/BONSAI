# Execution recipe: replace artifact paths/contract hashes on the secure server.
# Never place real patient artifacts in the repository. No training is launched.
estimand: binary_known_status_unweighted
contrast_manifest: opera/configs/manifests/final_contrasts_20261014.yaml
bootstrap_replicates: 1000
bootstrap_seed: 2026
analysis_horizons_days: [365]  # Run separate horizon/seed shards for large panels.
patient_gain_contrasts: [P5, R1, T1, T2, O1, E1, A1, A2, E3, E4]
artifacts:
  # Add entries for every model/seed/split and each specialist shard as needed.
  # Pooled native exports use grouped cohort labels; map to fine diagnoses.
  - path: /secure/locked/J_L/tuning/direct_cr_predictions.parquet
    format: direct_cif
    model: J_L
    seed: 42
    data_contract: REPLACE_WITH_RELEASE_SPLIT_ELIGIBILITY_CONTRACT_HASH
    cohort_from_metadata: true
  - path: /secure/locked/J_L/held_out/direct_cr_predictions.parquet
    format: direct_cif
    model: J_L
    seed: 42
    data_contract: REPLACE_WITH_RELEASE_SPLIT_ELIGIBILITY_CONTRACT_HASH
    cohort_from_metadata: true
  # Long CSV/parquet needs subject_id, cohort, outcome, horizon_days, split,
  # label, probability; model/seed/data_contract may come from this declaration.
  # Tabular outputs must already be joined to the locked label/eligibility table.
patient_metadata: /secure/analysis/preindex_patient_metadata.parquet
patient_metadata_column_map: {}  # Example: {firstline_date: index_date, diagnosis_date: cohort_identity_evidence_date}
identity_date_sensitivity: true  # Same fitted models, exclude later-dated diagnoses.
cell_metadata: /secure/analysis/target_cell_training_support.csv
coverage_roster: /secure/analysis/planned_model_cell_status.csv
# Optional route export adapted to long model/seed/split/cohort/outcome/
# subject_id/source/bank/weight rows, including shared weight.
route_weights: null
route_model: R_L  # Needed only for native JSON-bank route exports.
route_seed: 42
compute_inventory: null
calendar_covariates: [index_year]
domain_mismatch_covariates: []  # Add declared baseline/train-only feature names.
source_removal_contrasts: []  # Add extra_contrasts names for removal exports.
cell_groups:
  support_bin:
    column: n_events_train
    provenance: train_only
    # Same partition as the Bayesian support bins [0, 20, 100, 500]:
    # 0-19, 20-99, 100-499 and >=500 training events (integer counts).
    bins: [-1, 19, 99, 499, .inf]
  # Rare subtypes: fewer than 500 training patients (head count of the subtype).
  subtype_size:
    column: n_patients_train
    provenance: train_only
    bins: [-1, 499, .inf]
  # Subtypes without a dedicated prognostic index: no multivariable index derived
  # for the entity and externally validated (paper supplement,
  # tab:index-availability). Registry cohort_fine identifiers; must equal
  # opera.visualization.paper_taxonomy.NO_ROUTINE_INDEX (tested).
  no_index_subtype:
    column: cohort
    provenance: train_only
    label: no_index
    values: [LBL, HCL, ALCL, TRANSFORMED_FL, PCL, RT, SolM, NMZL, BCL, TCL]
  # Prespecified sensitivity analyses of that definition.
  no_index_family_level:  # the MZL-IPI counts for nodal MZL
    column: cohort
    provenance: train_only
    label: no_index
    values: [LBL, HCL, ALCL, TRANSFORMED_FL, PCL, RT, SolM, BCL, TCL]
  no_index_guideline_use:  # only routine, guideline-recommended indices count
    column: cohort
    provenance: train_only
    label: no_index
    values: [LBL, HCL, ALCL, TRANSFORMED_FL, PCL, RT, SolM, NMZL, BCL, TCL, AITL, BL]
patient_groups:
  age_at_index:
    provenance: pre_index
    bins: [0, 50, 65, 80, .inf]
  sex:
    provenance: pre_index
  history_event_count:
    provenance: pre_index
    bins: [-1, 99, 999, 9999, .inf]
  index_year:
    provenance: pre_index
    kind: calendar_year
  predominant_region:  # region of most pre-index contacts; the model is trained nationwide
    provenance: pre_index
  IPI:  # recorded prognostic-index category (low/medium/high); missing = not recorded
    provenance: pre_index
  national_vocabulary_coverage:  # share of pre-index national history tokens that are not [UNK] (national tokenisation)
    provenance: pre_index
    bins: [0, 0.8, 0.95, 1.0]
  # Add train-defined/pre-index token coverage, source mix and atypicality
  # columns with prespecified bins; never choose cutpoints on held-out gains.
# The configuration chosen on tuning data, analysed under the name OPERA
# (contrasts O1 = vs per-task XGBoost, O2 = vs joint, O3 = vs specialist).
# Update after the router-fix rule and the national-arm decision; the
# inventory's --opera-model (OPERA_PAPER_OPERA_MODEL) overrides it.
opera_model: R_L
# Same fits re-evaluated within each region where patients were treated
# (models trained nationwide): panel effects and absolute metrics per region.
stratified_reanalysis:
  # AUC is recomputed within these patient groups, using patient_groups bins
  # and the shared patient bootstrap (not averaged patient-level AUC gains).
  history_event_count:
    contrasts: [P5, T2, O1]
    models: [J_L, OPERA, X]
  age_at_index:
    contrasts: [P5, T2, O1]
    models: [J_L, OPERA, X]
  sex:
    contrasts: [P5, T2, O1]
    models: [J_L, OPERA, X]
  IPI:
    contrasts: [P5, T2, O1]
    models: [J_L, OPERA, X]
  predominant_region:
    contrasts: [P5, T2, O1]
    models: [J_L, OPERA, X]
  # Calendar year of treatment in the held-out test set: performance and
  # calibration as first-line treatment and the registers change.
  index_year:
    contrasts: [P5, T2, O1]
    models: [J_L, OPERA, X]
strategy_candidates: [S_L, D_L, O_L]
rescue:
  pooling: P5
  rescue: R1
  tolerance: 0.0  # Descriptive negative stratum; practical equivalence is separate.
  min_cases: 5
  min_controls: 5
# Gate for source-bank effects R2-R7: the R0 = gain(N_L,J_L) panel interval
# must lie inside +/- tolerance (gain scale per metric). Lock before held-out
# inspection; null leaves bank effects flagged as not interpretable.
router_null_equivalence:
  tolerance: {auc: null, brier: null, log_loss: null}
extra_contrasts:
  router_vs_specialist: gain(R_L,S_L)
# Source-removal inference exports can be entered as e.g. R_REMOVED_DLBCL;
# add gain(R_L,R_REMOVED_DLBCL) here. No learned-route causal claim follows.

# Decision points fixed on tuning data (opera.evaluation.operating_points).
operating_points:
  rules: [tuning_event_rate, tuning_youden, tuning_max_mcc,
          "tuning_specificity:0.80", "tuning_specificity:0.90", "tuning_specificity:0.95"]
  pairs: [[J_L, X], [J_L, S_L], [R_L, J_L]]
  minimum_tuning_events: 5
  minimum_cell_count: 5   # exported confusion counts below this are suppressed

# Cell-level performance eligibility; smaller cells remain in coverage outputs.
performance_min_cases: 5
performance_min_controls: 5
# Frequentist positive exchangeable patient-weight bootstrap (no dropped classes).
# bayesian: positive Dirichlet patient weights shared across every task/model;
# intervals are Bayesian patient-weight intervals, conditional on fixed IPCW.
bootstrap_method: multiplier
