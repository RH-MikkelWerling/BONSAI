# ══════════════════════════════════════════════════════════════════════
# OPERA Joint Multi-Task Finetuning Config
#
# Trains ONE model on ALL cohorts × ALL outcomes simultaneously.
# This is the experimental condition that tests whether the foundation
# model's shared representation outperforms separate tabular models.
#
# After training, point sweep_config.yaml at this checkpoint with:
#   encoder_source: joint
# ══════════════════════════════════════════════════════════════════════

defaults:
  - /core/base_train@
  - /hardware/1gpu6cpu@hardware
  - _self_

hydra:
  searchpath:
    - file://${oc.env:BONSAI_CONFIG_PATH}

encoder_ckpt: ???          # path to contrastive (or dapt/pretrain) checkpoint
encoder_source: contrastive  # "pretrain" | "dapt" | "contrastive"

dataset: joint   # used by base_train.yaml hydra.run.dir interpolation

paths:
  # vocabulary can come from any cohort — they share a token space.
  # Override vocab_cohort on the CLI if /dlbcl/ is not present.
  vocab_cohort: dlbcl
  vocabulary: ${oc.env:BONSAI_PROCESSED_DATA}/${paths.vocab_cohort}/vocabulary.pt
  # Set to last.ckpt to resume an interrupted run:
  #   paths.resume_ckpt=/path/to/last.ckpt
  resume_ckpt: null

# ── Cohorts: all disease cohorts trained jointly ───────────────────
cohorts:
  dlbcl:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/dlbcl
    registry_start_date: null
  cll:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/cll
    registry_start_date: null
  mds:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/mds
    registry_start_date: null
  myeloma:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/myeloma
    registry_start_date: null
  fl:
    data_dir: ${oc.env:BONSAI_PROCESSED_DATA}/fl
    registry_start_date: null

# ── Outcomes: all outcomes trained jointly ─────────────────────────
# Production runs require every configured cohort-outcome cell. Multiple task
# windows can reuse the same source event-time parquet via `outcome_file`.
outcomes:
  mortality_1y:
    outcome_file: mortality.parquet
    eligibility_file: mortality__audit.parquet
    n_hours_start_include: 1
    n_hours_end_include: 8760
  mortality_2y:
    outcome_file: mortality.parquet
    eligibility_file: mortality__audit.parquet
    n_hours_start_include: 1
    n_hours_end_include: 17520
  treatment_failure:
    outcome_file: treatment_failure.parquet
    eligibility_file: treatment_failure__audit.parquet
    n_hours_start_include: 1
    n_hours_end_include: null
  aki_30d:
    outcome_file: aki_first_documented.parquet
    eligibility_file: aki_first_documented__audit.parquet
    competing_outcome_file: mortality.parquet
    n_hours_start_include: 1
    n_hours_end_include: 720
  severe_infection_90d:
    outcome_file: severe_infection.parquet
    eligibility_file: severe_infection__audit.parquet
    competing_outcome_file: mortality.parquet
    n_hours_start_include: 1
    n_hours_end_include: 2160

model:
  pooling: bigru
  freeze_encoder: false   # true → ablation: only train heads
  dropout: 0.1

cross_outcome:
  # Match the primary contrastive run: no learned task suppression in the
  # production representation model, and no pooling advantage for common tasks.
  weighter: uniform
  aggregation: macro
  # Optional outcome-level effective-number factor. Keep false by default to
  # avoid double-boosting rare tasks; turn on only as a sensitivity run.
  class_balanced: false
  class_balanced_cap: 50.0
  class_balanced_beta: 0.9999
  # BCE-specific prevalence guardrail. Counts are auto-filled from train labels
  # by opera.run.joint_finetune when this is true and class_counts is empty.
  # Event-aware batches already enrich positives; do not weight them again.
  positive_class_weighted: false
  positive_class_weight_cap: 50.0
  # Prevent rare endpoints from contributing endless all-negative minibatches.
  require_both_classes_per_batch: true
  class_counts: {}

training:
  require_all_configured_cells: true
  batch_size: 64
  batch_sampling:
    type: event_aware
    min_events_per_batch: 4
    min_valid_per_batch: 16
    min_unique_events_for_focus: 1
    min_unique_valid_for_focus: 8
    n_quantiles: 4
    seed: 0
  accumulate_grad_batches: 2
  epochs: 20
  learning_rate: 5e-4
  encoder_lr_multiplier: 0.1
  optimizer_epsilon: 1e-6
  scheduler_warmup_epochs: 1
  early_stopping_patience: 5
  limit_val_batches: 1.0
  limit_train_batches: 1.0
