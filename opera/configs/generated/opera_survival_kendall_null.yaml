model:
  projection_hidden_dim: 256
  projection_dim: 128
  temperature: 0.07
  km_time_scale: 0.25
  dapt_lambda_floor: 1.0
  dapt_anchor_weight: 0.0
  competing_event_handling: exclude
  competing_event_weight: 0.0
  effective_pair_normalization: false
  projection_mode: shared
  freeze_encoder: false
  pooling: cls_last
competing_risk:
  loss_weight: 1.0
  contrastive_loss_weight: 0.1
  interval_boundaries_days:
  - 3
  - 7
  - 14
  - 30
  - 60
  - 90
  - 180
  - 365
  - 730
  - 1460
  time_scale_days: 365.25
  initial_log_hazard: -2.3
  smoothness_weight: 0.01
  no_competing_outcomes:
  - overall_survival
  - treatment_failure
  - treatment_failure_transformation
  weighter: kendall_null
  head_mode: linear
  family_trunk_hidden_dim: 128
  family_trunk_dropout: 0.1
  curriculum:
    enabled: false
    n_support_tiers: 5
    warmup_epochs: 1
    stage_epochs: 1
    ramp_epochs: 2
cross_outcome:
  weighter: uniform
  aggregation: macro
  class_balanced: false
  outcome_families:
    Disease control & survival:
    - overall_survival
    - treatment_failure
    - treatment_failure_transformation
    Treatment trajectory:
    - second_line_treatment
    Infection:
    - antibiotics
    - herpes_zoster
    - infections_all_definitions
    - infections_IV_based
    - infections_prescription_based
    - invasive_fungal
    - sepsis
    - serious_infection_composite
    Hematologic toxicity & support:
    - anemia_g2plus
    - anemia_g3plus
    - any_transfusion
    - eosinophilia
    - haptoglobin_decreased
    - leukocytosis_g2plus
    - lymphocytosis_g2plus
    - lymphocytosis_g3plus
    - lymphopenia_g2plus
    - lymphopenia_g3plus
    - neutropenia_g2plus
    - neutropenia_g3plus
    - platelet_transfusion
    - RBC_transfusion
    - severe_cytopenia
    - thrombocytopenia_g2plus
    - thrombocytopenia_g3plus
    - WBC_decreased_g2plus
    - WBC_decreased_g3plus
    Renal toxicity:
    - aki_first_documented
    - creatinine_increased_g2plus
    - creatinine_increased_g3plus
    - dialysis
    Hepatic & coagulation toxicity:
    - ALP_increased_g2plus
    - ALP_increased_g3plus
    - ALT_increased_g2plus
    - ALT_increased_g3plus
    - AST_increased_g2plus
    - AST_increased_g3plus
    - bilirubin_increased_g2plus
    - bilirubin_increased_g3plus
    - dic_like_coagulopathy
    - hepatotoxicity
    - hypofibrinogenemia_g2plus
    - hypofibrinogenemia_g3plus
    - hys_law_dili
    - INR_increased_g2plus
    - INR_increased_g3plus
    Electrolyte & metabolic toxicity:
    - hypercalcemia_g2plus
    - hypercalcemia_g3plus
    - hyperkalemia_g2plus
    - hyperkalemia_g3plus
    - hypermagnesemia_g3plus
    - hypernatremia_g2plus
    - hypernatremia_g3plus
    - hyperphosphatemia
    - hypertriglyceridemia_g2plus
    - hypertriglyceridemia_g3plus
    - hyperuricemia
    - hypoalbuminemia_g2plus
    - hypoalbuminemia_g3plus
    - hypocalcemia_g2plus
    - hypocalcemia_g3plus
    - hypoglycemia_g2plus
    - hypoglycemia_g3plus
    - hypokalemia_g2plus
    - hypokalemia_g3plus
    - hypomagnesemia_g2plus
    - hypomagnesemia_g3plus
    - hyponatremia_g2plus
    - hyponatremia_g3plus
    - LDH_increased
    - tumor_lysis_syndrome
    Cardiovascular & thrombotic:
    - atrial_fibrillation
    - heart_failure
    - MACE_composite
    - myocardial_infarction
    - stroke_TIA
    - VTE
    Acute care utilization:
    - emergency_stay
    - hospitalisation
    - respiratory_support
    Subsequent malignancy:
    - next_hematological_malignancy
    - next_malignancy
    Skeletal complications:
    - bone_fracture
  family_weights:
    Disease control & survival: 2.0
    Treatment trajectory: 2.0
  support_tau_locations: 100.0
  contrastive_term: kl
  outcome_scale_mode: none
training:
  require_all_configured_cells: true
  require_min_followup_train: false
  require_dapt_embedding_store: false
  batch_size: 8
  logical_batch_size: 256
  logical_val_batch_size: 256
  batch_sampling:
    type: random
  accumulate_grad_batches: 1
  epochs: 12
  learning_rate: 0.0002
  encoder_lr_multiplier: 0.1
  optimizer_epsilon: 1.0e-06
  scheduler_warmup_epochs: 1
  log_every_n_steps: 10
  probe_every_n_epochs: 5
  enable_validation_probe: false
  log_per_outcome_metrics: false
  limit_val_batches: 1.0
  limit_train_batches: 1.0
  numeric_value_control: inherit
