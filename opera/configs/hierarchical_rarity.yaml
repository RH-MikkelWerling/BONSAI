# Primary natural-rarity analysis: OPERA versus the base-pretrained encoder,
# trained and evaluated independently within each cohort_fine. This config
# fails closed if any grouped/global artifact enters its result root.

results_root: ${oc.env:BONSAI_RESULTS_ROOT,.}/production_sweeps/fine
output_dir: ${oc.env:BONSAI_RESULTS_ROOT,.}/hierarchical_rarity/fine_opera_vs_base
sweep_config: opera/configs/generated/fine_cox.yaml
task_metadata: null
# Generated from experiment_registry.yaml; do not duplicate the 87-endpoint
# family mapping in this analysis config.
outcome_families_file: generated/outcome_families.yaml

analysis:
  analysis_level: fine
  model_family: opera
  comparator_family: base_pretrain
  evaluation_subset: full
  primary_metric: auroc
  metrics: [auroc]
  rarity_column: n_events_train
  require_mapped_outcomes: true
  bootstrap_replicates: 2000
  bootstrap_seed: 2026
  # All cells with both outcome classes remain in the raw analysis. Precision
  # tiers are descriptive rather than an empirical-support exclusion rule.
  minimum_test_positive: 1
  minimum_test_negative: 1
  primary_test_positive: 25
  primary_test_negative: 25
  small_sample_minority_threshold: 10

model:
  spline_knots: 6
  grid_size: 200
  standard_error_floor: 0.001
  prior_scale: 0.10
  random_effect_scale: 0.05
  fit_tiers: [primary, partial_pool_only]
  nest_outcomes: true
  min_report_minority: 25
  require_convergence: true

sampling:
  draws: 2000
  tune: 2000
  chains: 4
  cores: 4
  target_accept: 0.95
  seed: 2026

figure:
  title: "OPERA benefit across fine-cohort task information"
  model_label: OPERA
  comparator_label: Base-pretrained encoder
  show_predictive_interval: true
  max_labels: 7
  highlight_cells:
    - {cohort: DLBCL, outcome: treatment_failure, label: "DLBCL × treatment failure"}
    - {cohort: BL, outcome: overall_survival, label: "BL × overall survival"}
    - {cohort: CLL, outcome: infections_prescription_based, label: "CLL × prescription-based infection"}
    - {cohort: MM, outcome: severe_cytopenia, label: "MM × severe cytopenia"}
    - {cohort: HL, outcome: hospitalisation, label: "HL × hospitalisation"}
  highlight_outcomes: [overall_survival, treatment_failure, sepsis, MACE_composite]
  outcome_family_order:
    - Disease control & survival
    - Treatment trajectory
    - Infection
    - Hematologic toxicity & support
    - Renal toxicity
    - Hepatic & coagulation toxicity
    - Electrolyte & metabolic toxicity
    - Cardiovascular & thrombotic
    - Acute care utilization
    - Subsequent malignancy
    - Skeletal complications
  cohort_course_groups:
    DLBCL_like: Aggressive course group
    T_NHL: Aggressive course group
    HL: Aggressive course group
    BL_LBL: Aggressive course group
    CLL_SLL: Indolent / chronic course group
    Indolent_B_NHL: Indolent / chronic course group
    HCL: Indolent / chronic course group
    MCL: Indolent / chronic course group
    MM: Plasma-cell group
    AMYLOIDOSIS: Plasma-cell group
  cohort_group_labels:
    DLBCL_like: DLBCL-like
    T_NHL: T-NHL
    HL: HL
    BL_LBL: BL/LBL
    CLL_SLL: CLL/SLL
    Indolent_B_NHL: Indolent B-NHL
    HCL: HCL
    MCL: MCL
    MM: MM
    AMYLOIDOSIS: Amyloidosis
