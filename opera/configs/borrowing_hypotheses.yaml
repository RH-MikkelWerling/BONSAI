# Prespecified source-removal hypotheses for the borrowing map (Paper III).
# DRAFT 2026-10-22, pending review by the study haematologists; must be fixed
# before the test set is opened.
#
# Each entry: target disease, the source disease whose adapter is switched off,
# a clinical domain (one of the 12, or "All outcomes"), and our rationale and
# evidence (for the supplement; never shown to the reviewing haematologists).
#
# Review: the haematologists see every candidate below, hypotheses and controls
# mixed in one list in a fixed random order, without rationale or grouping, and
# rate each as strong / moderate / weak / none / don't know
# (paper/review/borrowing_pairs_review.pdf; the key mapping their numbers to
# pairs is paper/review/borrowing_pairs_key.csv). Their ratings set the strength
# (clinician_rating) and decide the final split: pairs they rate strong or
# moderate are the hypotheses, pairs they rate none are the negative controls,
# the rest are dropped.
#
# Eligibility, applied before review and blind to any result: a pair is only a
# candidate if a single-pair estimate can be informative.
#   - source: at least 200 training patients. With fewer, the source's
#     correction learns little, so "no effect" would be guaranteed rather than
#     informative (this matters most for the negative controls).
#   - target: at least 50 test patients, and estimable test cells in the domain
#     (estimability rule of the analysis; confirm from the cell metadata). Below
#     ~50 patients a cell has a handful of events and a per-pair interval spans
#     several AUC points against a 0.25-point margin, so the label would be
#     "inconclusive" by construction.
# Small diseases still appear in the descriptive borrowing map; they are only
# kept out of the named claims. Excluded candidates are listed at the end.
#
# Primary claim: the hypotheses as a set gain more from their source alone than
# the other pairs of their domains (permutation test); the negative controls
# should not. Per pair: AUC gain of the source alone (own disease + source vs own
# disease only), labelled better / worse / equivalent / inconclusive against the
# practical margin below. The model-comparison margin (1 point) is too wide
# here: a single source's share is a fraction of the routing gain, so a real
# contribution of a few tenths of a point would be called "equivalent".
# DRAFT value; to be fixed with the pairs, before the test set is opened.
margin_points: 0.25
hypotheses:
  - target: SLL
    source: CLL
    domain: "All outcomes"
    rationale: >-
      One disease in two presentations (blood vs lymph nodes), managed by the same
      criteria and treatments.
    evidence: ["WHO 5th edition classification (Alaggio et al., Leukemia 2022)"]
  - target: SMZL
    source: EMZL
    domain: "Disease course and later malignancy"
    rationale: >-
      The marginal-zone lymphomas share prognostic factors: the MZL-IPI (LDH,
      haemoglobin, lymphocyte and platelet counts, subtype) was built for and
      validated across all subtypes, and advanced disease is treated with the
      same rituximab-based regimens. First-line treatment often differs
      (radiotherapy for localised EMZL; rituximab alone or splenectomy for SMZL).
    evidence: ["Arcaini et al., EClinicalMedicine 2024, doi:10.1016/j.eclinm.2024.102592"]
  - target: CLL
    source: MM
    domain: "Infection and antimicrobial use"
    rationale: >-
      Both cause secondary humoral immune deficiency (hypogammaglobulinaemia in
      up to 85% of CLL during the disease course, and intrinsic or
      treatment-related in myeloma), with the same immunoglobulin-replacement
      indications.
    evidence: ["Frontiers in Immunology 2014, doi:10.3389/fimmu.2014.00626",
               "Frontiers in Immunology 2016, doi:10.3389/fimmu.2016.00317"]
  - target: MM
    source: CLL
    domain: "Infection and antimicrobial use"
    rationale: "The same, in the other direction."
    evidence: ["As above"]
  - target: LBL
    source: BL
    domain: "Neutrophil, white-cell and platelet findings"
    rationale: >-
      Both receive short, highly intensive regimens (CODOX-M/IVAC, hyper-CVAD,
      ALL-type protocols) with marked myelosuppression despite growth-factor
      support. Holds whether or not the LBL cohort includes adult ALL (open
      question for the haematologists).
    evidence: ["Reviews of adult Burkitt lymphoma treatment (hyper-CVAD, CODOX-M/IVAC toxicity)"]
  - target: LBL
    source: BL
    domain: "Metabolic and cell-turnover markers"
    rationale: >-
      Rapid tumour turnover and intensive induction put both at risk of tumour
      lysis (potassium, phosphate, urate, creatinine).
    evidence: ["Reviews of adult Burkitt lymphoma treatment (tumour lysis precautions)"]
  - target: TCL
    source: PTCL
    domain: "Disease course and later malignancy"
    rationale: >-
      Unspecified T-cell lymphoma is managed like peripheral T-cell lymphoma, not
      otherwise specified (CHOP-based therapy), with a similarly poor course.
    evidence: ["WHO 5th edition classification (Alaggio et al., Leukemia 2022)"]
  - target: AITL
    source: PTCL
    domain: "Disease course and later malignancy"
    rationale: >-
      Angioimmunoblastic T-cell lymphoma (nodal T-follicular-helper lymphoma in
      WHO 5) is treated with the same CHOP-based first-line regimens as PTCL,
      not otherwise specified, with a similarly poor course; the two are often
      hard to tell apart histologically.
    evidence: ["WHO 5th edition classification (Alaggio et al., Leukemia 2022)"]
  - target: LPL
    source: CLL
    domain: "Cardiovascular and thrombotic events"
    rationale: >-
      BTK inhibitors, used in CLL and in Waldenstrom macroglobulinaemia, cause
      atrial fibrillation and bleeding. But first-line Waldenstrom
      treatment in Denmark has mostly been chemoimmunotherapy (e.g.
      bendamustine-rituximab), so a null result here would be unsurprising.
    evidence: ["Brown et al., Haematologica 2017 (pooled AF in ibrutinib trials), PMC5622864"]
negative_controls:
  - target: HL
    source: MM
    domain: "All outcomes"
    rationale: >-
      No shared biology, treatment or complication profile (young patients on
      ABVD-type therapy vs older patients on myeloma regimens); MM is the
      second-largest source, so this also tests whether a large source helps
      regardless of relevance.
  - target: DLBCL
    source: HCL
    domain: "Disease course and later malignancy"
    rationale: >-
      No shared biology or course (indolent, cladribine-treated vs aggressive,
      R-CHOP-treated).
  - target: CLL
    source: ALCL
    domain: "All outcomes"
    rationale: >-
      No shared biology, treatment or complication profile (a T-cell lymphoma
      treated with CHOP-type therapy vs an indolent B-cell leukaemia).
# Candidates that fail the eligibility rule (test patients from Table 1).
excluded_candidates:
  - {target: TRANSFORMED_FL, source: DLBCL, domain: "Disease course and later malignancy",
     reason: "target has 44 test patients"}
  - {target: RT, source: DLBCL, domain: "Disease course and later malignancy",
     reason: "target has 25 test patients"}
  - {target: RT, source: CLL, domain: "Infection and antimicrobial use",
     reason: "target has 25 test patients"}
  - {target: PCL, source: MM, domain: "Disease course and later malignancy",
     reason: "target has 38 test patients"}
  - {target: AMYLOIDOSIS, source: MM, domain: "Renal injury and support",
     reason: "target has 17 test patients"}
  - {target: SolM, source: ALCL, domain: "All outcomes",
     reason: "target has 32 test patients (was a negative control)"}
  - {target: HL, source: AMYLOIDOSIS, domain: "All outcomes",
     reason: "source has 22 training patients (was a negative control)"}
  - {target: HCL, source: TRANSFORMED_FL, domain: "Disease course and later malignancy",
     reason: "HCL has no second-line outcomes and almost no deaths, so no estimable cells (was a negative control)"}
