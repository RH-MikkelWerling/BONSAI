defaults:
  - /core/base_train@
  - /hardware/1gpu6cpu@hardware
  - _self_

hydra:
  searchpath:
    - file://${oc.env:BONSAI_CONFIG_PATH}

encoder_ckpt: ???
encoder_source: contrastive
dataset: ???
outcome: ???
# Primary cause-specific survival objective. This evaluates the Cox partial
# likelihood over the complete cohort while recomputing encoder gradients in
# memory-safe microbatches. Use `cox` only for the mini-batch approximation.
training_mode: cox_exact_cached

cohort_scope:
  name: null
  general_pretraining: frozen
  adaptation_cohorts: []
  finetune_cohort: null

paths:
  dir: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}
  train_split: ${paths.dir}/subject_data_train.pt
  val_split: ${paths.dir}/subject_data_tuning.pt
  subject_data_paths:
    - ${paths.train_split}
    - ${paths.val_split}
  vocabulary: ${paths.dir}/vocabulary.pt
  # Enriched cohort membership/metadata used for fine-cohort filtering.
  population: ${paths.dir}/population_metadata.csv
  outcome: ${paths.dir}/outcomes/${outcome}.parquet
  competing_outcome: null
  eligibility: null

labels:
  train_key: train
  val_key: tuning
  test_key: held_out
  n_hours_start_include: 1
  n_hours_end_include: null
  registry_start_date: null
  require_min_followup_train: false
  require_min_followup_val: false
  require_min_followup_test: false

model:
  # Complete native architecture is required for the random-init control.
  # Checkpoint-backed variants recover these fields from checkpoint metadata.
  architecture_version: bonsai-native-rope-v1
  hidden_size: 64
  num_layers: 4
  num_attention_heads: 4
  bias: false
  dropout: 0.1
  attention_dropout: 0.0
  causal: true
  attn_type: sdpa
  abspos_encoding: fourier
  max_seqlen: 8192
  # Declared here so strict Hydra overrides can configure a fair random-init
  # numeric control. Checkpoint-backed variants still recover their saved
  # encoder architecture, including the saved value integration mode.
  value_bin_vocab_size: 0
  value_embedding_mode: legacy

training:
  # Checkpoint-backed runs inherit the source pretraining input contract.
  # Random-init runs resolve inherit to observed.
  numeric_value_control: inherit
  max_len: ${model.max_seqlen}
  batch_size: 128
  batch_sampling:
    # Exact cached Cox visits every patient exactly once in deterministic order;
    # batch_size then controls memory only, not the statistical risk set.
    # Mini-batch `cox` spreads real events while preserving once-per-epoch
    # coverage. IPCW-BCE modes use ordinary random batches.
    type: auto
    seed: 0
  accumulate_grad_batches: 1
  epochs: 20
  learning_rate: 5e-4
  # Multiplier applied only to the pretrained encoder; the newly initialized
  # finetuning head uses learning_rate. Set to 0.1 for discriminative LR.
  encoder_lr_multiplier: 1.0
  optimizer_epsilon: 1e-6
  scheduler_warmup_epochs: 1
  # Survival/IPCW objectives do not use label resampling or extra positive
  # class weighting. Cox uses censoring-aware event times. `ipcw_bce` targets
  # net risk (competing events censored); `ipcw_cif_bce` targets cumulative
  # incidence (competing events are observed negatives).
  # auto: Cox selects by full-validation C-index; IPCW modes select by weighted
  # validation log loss, which remains defined in one-class rare cells.
  eval_monitor_metric: auto
  early_stopping_patience: 5
  limit_val_batches: 1.0
  limit_train_batches: 1.0
