    LABTEST//NPU19763//BIN: ferritin
    LABTEST//NPU02636//BIN: lymphocyte
    LABTEST//NPU01933//BIN: eosinophil
    LABTEST//NPU03429//BIN: sodium
    LABTEST//NPU03230//BIN: potassium
    PATHOLOGY//M96803: DLBCL morphology
    PATHOLOGY//FE16E3: TP53 mutation detected
    PATHOLOGY//FE16E4: TP53 deletion detected
