# What the model relies on: integrated gradients and input restriction.
#
# Lock this file (with the analysis lock) BEFORE running the attributions. The
# expected directions are prespecified plausibility checks, not tests of causal
# effects. Intervals describe the explained patients given the fitted model.
#
# Codes: ICD-10 as recorded in DALY-CARE (D-prefixed), ATC, NPU. Every NPU code
# still needs matching against the study vocabulary and bin boundaries. Public
# identities and sources are in docs/ATTRIBUTION_CONCEPT_MAPPING_REVIEW_20261028.csv
# and docs/DANISH_CODE_AUDIT_20261028.md. Molecular meanings are from Patobank.
# Set concept_mapping_reviewed: true only after that vocabulary audit.

concept_mapping_reviewed: false
# Opt-in only for an auditable tuning rehearsal. Never authorises held-out use.
allow_provisional_concepts: false

# Names for codes (opera/resources/code_systems/README.md). Official tables are
# public classifications copied into the secure environment; codes are
# normalised, so SKS and WHO forms both match. Without tables, codes are named
# from the built-in structure (ICD-10 chapters, ATC levels 1-2, clinical
# groups) or shown as codes. `vocabulary-audit` reports what is still unnamed.
code_tables: []
#  - {system: icd10, path: /project/resources/icd10_en.csv, code: code, label: name}
#  - {system: atc, path: /project/resources/atc.csv, code: code, label: name}
#  - {system: npu, path: /project/resources/npu.xlsx, code: NPU code, label: Short definition}
#  - {system: sks_procedure, path: /project/resources/sks.csv, code: code, label: text}
# clinical_groups: opera/resources/code_systems/clinical_groups.yaml  # default

run:
  # One run on the locked best model, computed once. Every outcome is explained
  # on the log-odds scale for the atlas (comparable across outcomes); the check
  # outcomes are also explained in absolute risk, for the laboratory curves,
  # the removal checks and the per-patient explanation records. Pilot first
  # (--attribution-max-new-patients 50), then --resume completes the sample.
  split: held_out
  outcomes: all
  horizons: [365]
  borrowed_outcomes: ""
  check_outcomes: [overall_survival, serious_infection_composite, neutropenia_g3plus]
  # Every test patient (weight 1). A number instead gives a stratified sample:
  # up to per_subtype from every subtype, the rest uniform, with sampling
  # weights restoring the population mix (fallback if compute is short).
  max_patients: all
  per_subtype: 40
  steps: 8                    # Gauss-Legendre nodes; patients above tolerance rerun at 32
  precision: fp32             # bf16/fp16 opt-in after a pilot, guarded by completeness
  tolerance: 0.05             # completeness gap relative to |prediction - reference|
  baseline: mean              # average training event (content embedding)
  alternative_baseline: source_mean
  k: [1, 5, 10]
  random_repeats: 5
  faithfulness_patients: 200
  sanity_patients: 100

# The same model on restricted input, whole test set, every outcome (the
# input-restrictions action). "Only the timing of care" replaces every event by
# the IG reference, so run the attributions first.
restrictions:
  - {id: timeline, label: "Only the timing of care", content_reference: true}
  - {id: no_labs, label: "Without laboratory results", hide_prefixes: [LABTEST]}
  - {id: no_medication, label: "Without medication", hide_prefixes: [MEDICATION]}
  - {id: no_diagnoses, label: "Without diagnoses", hide_prefixes: [DIAGNOSIS]}
  # Region and specialty of care: two regions add richer hospital-record data,
  # so region partly marks which data a patient has (a possible shortcut).
  - {id: no_region_specialty, label: "Without region and specialty",
     hide_prefixes: [REGION, CONTACT_SPECIALTY, RC_REG, RC_SPEC]}
  - {id: last_year, label: "Only the last year", keep_last_days: 365}
  # Gap before prediction (added 2026-10-27): the most recent weeks hidden, to see
  # how much the predictions, laboratory outcomes above all, rest on the latest
  # measurements.
  - {id: gap_7d, label: "Last 7 days hidden", drop_last_days: 7}
  - {id: gap_14d, label: "Last 14 days hidden", drop_last_days: 14}
  - {id: gap_21d, label: "Last 21 days hidden", drop_last_days: 21}
  - {id: gap_28d, label: "Last 28 days hidden", drop_last_days: 28}

# Laboratory curves: the latest result before treatment, by value bin.
lab_tests:
  - {npu: NPU19658, label: "LDH", outcome: overall_survival}
  - {npu: NPU19673, label: "Albumin", outcome: overall_survival}
  - {npu: NPU02902, label: "Neutrophils", outcome: neutropenia_g3plus}
  - {npu: NPU19748, label: "CRP", outcome: serious_infection_composite}

# Findings x outcomes (atlas panel C). Every finding is summarised for every
# outcome; "expected" gives the prespecified direction where an effect is
# expected (+ raises, - lowers predicted risk), and only those cells are tests. Laboratory findings
# use the latest result within 90 days (bin_position: 0 lowest, 1 highest).
concepts:
  - {name: ldh_high, label: "Upper LDH bins", group: Laboratory, codes: ["LABTEST//NPU19658//BIN_"],
     bin_position: [0.67, 1.0], latest_only: true, within_days: 90,
     expected: {overall_survival: "+", treatment_failure: "+"}}
  - {name: albumin_low, label: "Lower albumin bins", group: Laboratory, codes: ["LABTEST//NPU19673//BIN_"],
     bin_position: [0.0, 0.33], latest_only: true, within_days: 90,
     expected: {overall_survival: "+", serious_infection_composite: "+"}}
  - {name: haemoglobin_low, label: "Lower haemoglobin bins", group: Laboratory,
     codes: ["LABTEST//NPU02319//BIN_"], bin_position: [0.0, 0.33], latest_only: true,
     within_days: 90, expected: {any_transfusion: "+", overall_survival: "+"}}
  - {name: neutrophils_low, label: "Lower neutrophil bins", group: Laboratory,
     codes: ["LABTEST//NPU02902//BIN_"], bin_position: [0.0, 0.33], latest_only: true,
     within_days: 90, expected: {neutropenia_g3plus: "+", serious_infection_composite: "+"}}
  - {name: platelets_low, label: "Lower platelet bins", group: Laboratory,
     codes: ["LABTEST//NPU03568//BIN_"], bin_position: [0.0, 0.33], latest_only: true,
     within_days: 90, expected: {any_transfusion: "+", neutropenia_g3plus: "+"}}
  - {name: creatinine_high, label: "Upper creatinine bins", group: Laboratory,
     codes: ["LABTEST//NPU18016//BIN_"], bin_position: [0.67, 1.0], latest_only: true,
     within_days: 90, expected: {aki_first_documented: "+", overall_survival: "+"}}
  - {name: crp_high, label: "Upper CRP bins", group: Laboratory, codes: ["LABTEST//NPU19748//BIN_"],
     bin_position: [0.67, 1.0], latest_only: true, within_days: 90,
     expected: {serious_infection_composite: "+"}}
  # Exact positive-result codes verified against the public Danish Patobank
  # molecular codebook. Negative/normal, VUS and amplification codes are not
  # interchangeable with mutation/deletion or translocation. Historical validity
  # and the model vocabulary remain to be audited. These tuning additions must
  # be locked before held-out use, rather than described as earlier prespecification.
  - {name: tp53_aberration, label: "TP53 mutation/deletion recorded", group: Pathology,
     codes: ["PATHOLOGY//FE16E3", "PATHOLOGY//FE16E4", "PATHOLOGY//FK17D0",
             "PATHOLOGY//M632C0"], exact_codes: true,
     expected: {treatment_failure: "+", overall_survival: "+"}}
  - {name: myc_rearrangement, label: "MYC translocation recorded", group: Pathology,
     # M636D0 is the historical MYC code used by DALY-CARE's own molecular dictionary.
     codes: ["PATHOLOGY//FE18UA", "PATHOLOGY//M636D0", "PATHOLOGY//J3N8U1",
             "PATHOLOGY//J3N8U3", "PATHOLOGY//JFR8U1"], exact_codes: true,
     expected: {treatment_failure: "+", overall_survival: "+"}}
  - {name: ighv_unmutated, label: "Unmutated IGHV recorded", group: Pathology,
     codes: ["PATHOLOGY//FE13N8"], exact_codes: true,
     expected: {treatment_failure: "+"}}
  - {name: heart_failure, label: "Heart failure", group: Diagnoses, codes: ["DIAGNOSIS//DI50"],
     expected: {heart_failure: "+", overall_survival: "+"}}
  - {name: kidney_disease, label: "Chronic kidney disease", group: Diagnoses,
     codes: ["DIAGNOSIS//DN18"], expected: {aki_first_documented: "+"}}
  - {name: pneumonia, label: "Pneumonia", group: Diagnoses, codes: ["DIAGNOSIS//DJ12", "DIAGNOSIS//DJ13", "DIAGNOSIS//DJ14",
     "DIAGNOSIS//DJ15", "DIAGNOSIS//DJ16", "DIAGNOSIS//DJ17", "DIAGNOSIS//DJ18"],
     expected: {serious_infection_composite: "+"}}
  - {name: antibacterials, label: "Systemic antibacterials, last year", group: Medication,
     codes: ["MEDICATION//J01"], within_days: 365,
     expected: {serious_infection_composite: "+"}}
  - {name: corticosteroids, label: "Systemic glucocorticoids, last 90 days", group: Medication,
     codes: ["MEDICATION//H02AB"], within_days: 90,
     expected: {serious_infection_composite: "+"}}
  - {name: antineoplastics, label: "Antineoplastics, last year", group: Medication,
     codes: ["MEDICATION//L01"], within_days: 365,
     expected: {neutropenia_g3plus: "+", any_transfusion: "+"}}

# Additional exploratory candidates, proposed during the tuning rehearsal.
# Public NPU identities are documented in the mapping ledger. No expected signs
# are attached retrospectively. Bin extremes are relative to this vocabulary.
  - {name: alt_high, label: "Upper ALT bins", group: Laboratory, codes: ["LABTEST//NPU19651//BIN_"],
     bin_position: [0.67, 1], latest_only: true, within_days: 90, expected: {}}
  - {name: alp_high, label: "Upper ALP bins", group: Laboratory, codes: ["LABTEST//NPU27783//BIN_"],
     bin_position: [0.67, 1], latest_only: true, within_days: 90, expected: {}}
  - {name: bilirubin_high, label: "Upper bilirubin bins", group: Laboratory, codes: ["LABTEST//NPU01370//BIN_"],
     bin_position: [0.67, 1], latest_only: true, within_days: 90, expected: {}}
  - {name: ferritin_high, label: "Upper ferritin bins", group: Laboratory, codes: ["LABTEST//NPU19763//BIN_"],
     bin_position: [0.67, 1], latest_only: true, within_days: 90, expected: {}}
  - {name: lymphocytes_high, label: "Upper lymphocyte bins", group: Laboratory, codes: ["LABTEST//NPU02636//BIN_"],
     bin_position: [0.67, 1], latest_only: true, within_days: 90, expected: {}}
  - {name: eosinophils_high, label: "Upper eosinophil bins", group: Laboratory, codes: ["LABTEST//NPU01933//BIN_"],
     bin_position: [0.67, 1], latest_only: true, within_days: 90, expected: {}}
  - {name: sodium_low, label: "Lower sodium bins", group: Laboratory, codes: ["LABTEST//NPU03429//BIN_"],
     bin_position: [0, 0.33], latest_only: true, within_days: 90, expected: {}}
  - {name: potassium_high, label: "Upper potassium bins", group: Laboratory, codes: ["LABTEST//NPU03230//BIN_"],
     bin_position: [0.67, 1], latest_only: true, within_days: 90, expected: {}}

summary:
  horizon_days: 365
  bootstrap_draws: 1000
  seed: 2026
  min_count: 20               # patients per reported cell, bin or curve point
  time_windows_days: [30, 365]
  faithfulness_k: 5           # prespecified k for the check (Fig. D)
  lab_within_days: 90
  episode_gap_days: 1         # events within a day form one clinical episode
  top_n: 10                   # data-driven findings per outcome and direction (table)
  explanation_episodes: 3     # per patient, outcome and direction in the explanation table
  # Clinical names for rolled-up concepts (ICD-10 3 characters, ATC level 3,
  # laboratory tests as LABTEST//<NPU>//BIN, shown as lower/middle/upper bins).
  # These are relative value bins, not clinical reference intervals.
  # Used only when concept_mapping_reviewed is true.
  # Public code identities are proposed separately from study-vocabulary validation.
  concept_labels:
    DIAGNOSIS//DI50: Heart failure
    DIAGNOSIS//DI48: Atrial fibrillation or flutter
    DIAGNOSIS//DI21: Acute myocardial infarction
    DIAGNOSIS//DI26: Pulmonary embolism
    DIAGNOSIS//DN17: Acute kidney failure
    DIAGNOSIS//DN18: Chronic kidney disease
    DIAGNOSIS//DE10: Type 1 diabetes
    DIAGNOSIS//DE11: Type 2 diabetes
    DIAGNOSIS//DJ18: Pneumonia
    DIAGNOSIS//DJ15: Bacterial pneumonia
    DIAGNOSIS//DJ44: COPD
    DIAGNOSIS//DA41: Sepsis
    DIAGNOSIS//DB02: Herpes zoster
    DIAGNOSIS//DD70: Neutropenia
    MEDICATION//J01C: Penicillins
    MEDICATION//J01D: Other beta-lactam antibacterials
    MEDICATION//J01M: Quinolones
    MEDICATION//J02A: Systemic antimycotics
    MEDICATION//J05A: Direct-acting antivirals
    MEDICATION//L01A: Alkylating agents
    MEDICATION//L01B: Antimetabolites
    MEDICATION//L01X: Other antineoplastics
    MEDICATION//L04A: Immunosuppressants
    MEDICATION//H02A: Plain systemic corticosteroids
    MEDICATION//C03C: High-ceiling diuretics
