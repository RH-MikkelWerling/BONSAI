    MEDICATION//A10A: Insulins and analogues
    MEDICATION//N02A: Opioids
    LABTEST//NPU02319//BIN: Haemoglobin
    LABTEST//NPU19658//BIN: LDH
    LABTEST//NPU19673//BIN: Albumin
    LABTEST//NPU02902//BIN: Neutrophils
    LABTEST//NPU03568//BIN: Platelets
    LABTEST//NPU18016//BIN: Creatinine
    LABTEST//NPU19748//BIN: CRP
    LABTEST//NPU19651//BIN: ALT
    LABTEST//NPU27783//BIN: ALP
