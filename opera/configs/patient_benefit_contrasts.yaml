output_dir: /results/patient_benefit

contrasts:
  - name: opera_vs_tabular_ehr
    description: "Foundation model vs. tabular EHR baseline - primary claim"
    primary: true
    baseline_predictions: /results/tabular_ehr/{cohort}/{outcome}/predictions.csv
    comparator_predictions: /results/opera/{cohort}/{outcome}/predictions.csv
    baseline_embeddings: /embeddings/per_cohort_contrastive/{cohort}.parquet
    metadata: /data/{cohort}/population.csv
    cohort_col: cohort
    subject_col: subject_id
    gain_col: brier_gain
    atypicality_mode: both

  - name: dapt_vs_contrastive
    description: "DAPT-only vs. per-cohort contrastive - effect of outcome-guided adaptation"
    primary: false
    baseline_predictions: /results/dapt/{cohort}/{outcome}/predictions.csv
    comparator_predictions: /results/opera_per_cohort/{cohort}/{outcome}/predictions.csv
    baseline_embeddings: /embeddings/dapt/{cohort}.parquet
    metadata: /data/{cohort}/population.csv
    cohort_col: cohort
    subject_col: subject_id
    gain_col: brier_gain
    atypicality_mode: own

  - name: hematology_pretrain_vs_general_pretrain
    description: "General population pretraining vs. hematology-only pretraining - the irrelevant patients"
    primary: true
    baseline_predictions: /results/hematology_only_pretrain/{cohort}/{outcome}/predictions.csv
    comparator_predictions: /results/general_pretrain/{cohort}/{outcome}/predictions.csv
    baseline_embeddings: /embeddings/hematology_only_pretrain/{cohort}.parquet
    metadata: /data/{cohort}/population.csv
    cohort_col: cohort
    subject_col: subject_id
    gain_col: brier_gain
    atypicality_mode: nearest

  - name: per_cohort_vs_joint_contrastive
    description: "Per-cohort vs. joint contrastive - cross-disease representation learning"
    primary: false
    baseline_predictions: /results/opera_per_cohort/{cohort}/{outcome}/predictions.csv
    comparator_predictions: /results/opera_joint/{cohort}/{outcome}/predictions.csv
    baseline_embeddings: /embeddings/per_cohort_contrastive/{cohort}.parquet
    metadata: /data/{cohort}/population.csv
    cohort_col: cohort
    subject_col: subject_id
    gain_col: brier_gain
    atypicality_mode: own

cohorts:
  - dlbcl
  - cll
  - myeloma
  - mds
  - fl

outcomes:
  - mortality_1y
  - treatment_failure
