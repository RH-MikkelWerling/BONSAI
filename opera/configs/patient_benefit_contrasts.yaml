output_dir: ${BONSAI_RESULTS_ROOT}/patient_benefit

contrasts:
  - name: opera_vs_tabular_ehr
    description: "Foundation model vs. tabular EHR baseline - primary claim"
    primary: true
    baseline_predictions: ${BONSAI_RESULTS_ROOT}/opera_sweep/{cohort}/{outcome}/tabular_ehr/seed_42/predictions.npz
    comparator_predictions: ${BONSAI_RESULTS_ROOT}/opera_sweep/{cohort}/{outcome}/opera/seed_42/predictions.npz
    baseline_embeddings: ${BONSAI_RESULTS_ROOT}/opera_sweep/{cohort}/{outcome}/opera/seed_42/predictions.npz
    metadata: ${BONSAI_PROCESSED_DATA}/{cohort}/population_full.csv
    cohort_col: cohort
    subject_col: subject_id
    gain_col: brier_gain
    atypicality_mode: both

  - name: dapt_vs_contrastive
    description: "DAPT-only vs. per-cohort contrastive - effect of outcome-guided adaptation"
    primary: false
    baseline_predictions: ${BONSAI_RESULTS_ROOT}/opera_sweep/{cohort}/{outcome}/dapt/seed_42/predictions.npz
    comparator_predictions: ${BONSAI_RESULTS_ROOT}/opera_sweep/{cohort}/{outcome}/opera_per_cohort/seed_42/predictions.npz
    baseline_embeddings: ${BONSAI_RESULTS_ROOT}/opera_sweep/{cohort}/{outcome}/dapt/seed_42/predictions.npz
    metadata: ${BONSAI_PROCESSED_DATA}/{cohort}/population_full.csv
    cohort_col: cohort
    subject_col: subject_id
    gain_col: brier_gain
    atypicality_mode: own

  - name: daly_care_pretrain_vs_general_pretrain
    description: "Broad-cohort pretraining vs. DALY-CARE-only pretraining"
    primary: true
    baseline_predictions: ${BONSAI_RESULTS_ROOT}/opera_sweep/{cohort}/{outcome}/daly_care_pretrain/seed_42/predictions.npz
    comparator_predictions: ${BONSAI_RESULTS_ROOT}/opera_sweep/{cohort}/{outcome}/base_pretrain/seed_42/predictions.npz
    baseline_embeddings: ${BONSAI_RESULTS_ROOT}/opera_sweep/{cohort}/{outcome}/daly_care_pretrain/seed_42/predictions.npz
    metadata: ${BONSAI_PROCESSED_DATA}/{cohort}/population_full.csv
    cohort_col: cohort
    subject_col: subject_id
    gain_col: brier_gain
    atypicality_mode: nearest

  - name: per_cohort_vs_joint_contrastive
    description: "Per-cohort vs. joint contrastive - cross-disease representation learning"
    primary: false
    baseline_predictions: ${BONSAI_RESULTS_ROOT}/opera_sweep/{cohort}/{outcome}/opera_per_cohort/seed_42/predictions.npz
    comparator_predictions: ${BONSAI_RESULTS_ROOT}/opera_sweep/{cohort}/{outcome}/opera_joint_contrastive/seed_42/predictions.npz
    baseline_embeddings: ${BONSAI_RESULTS_ROOT}/opera_sweep/{cohort}/{outcome}/opera_per_cohort/seed_42/predictions.npz
    metadata: ${BONSAI_PROCESSED_DATA}/{cohort}/population_full.csv
    cohort_col: cohort
    subject_col: subject_id
    gain_col: brier_gain
    atypicality_mode: own

cohorts:
  - dlbcl
  - cll
  - myeloma
  - mds
  - fl

outcomes:
  - mortality_1y
  - treatment_failure
