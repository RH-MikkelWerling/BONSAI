    training_cohort: bl_lbl
    cohort_fine_col: cohort_fine
    cohort_fine_value: BL
    ipi_score_col: null
    registry_start_date: null

  LBL:
    data_dir: ${BONSAI_PROCESSED_DATA}/bl_lbl
    training_cohort: bl_lbl
    cohort_fine_col: cohort_fine
    cohort_fine_value: LBL
    ipi_score_col: null
    registry_start_date: null

  # ── Plasma-cell disorders ────────────────────────────────────────────
  MM:
    data_dir: ${BONSAI_PROCESSED_DATA}/mm
    training_cohort: mm
    cohort_fine_col: cohort_fine
