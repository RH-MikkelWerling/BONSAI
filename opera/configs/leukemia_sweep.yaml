  # ── T-cell NHL ───────────────────────────────────────────────────────
  AITL:
    data_dir: ${BONSAI_PROCESSED_DATA}/t_nhl
    training_cohort: t_nhl
    cohort_fine_col: cohort_fine
    cohort_fine_value: AITL
    ipi_score_col: ipi
    registry_start_date: null

  ALCL:
    data_dir: ${BONSAI_PROCESSED_DATA}/t_nhl
    training_cohort: t_nhl
    cohort_fine_col: cohort_fine
    cohort_fine_value: ALCL
    ipi_score_col: ipi
    registry_start_date: null

  PTCL:
    data_dir: ${BONSAI_PROCESSED_DATA}/t_nhl
    training_cohort: t_nhl
    cohort_fine_col: cohort_fine
    cohort_fine_value: PTCL
    ipi_score_col: ipi
    registry_start_date: null

  TCL:
    data_dir: ${BONSAI_PROCESSED_DATA}/t_nhl
    training_cohort: t_nhl
