# ══════════════════════════════════════════════════════════════════════
# OPERA Evaluation Sweep — Leukemia Registry (train-on-grouped / eval-on-fine)
# ══════════════════════════════════════════════════════════════════════
#
# Models are trained on broad `cohort_grouped` disease groups (see
# leukemia_contrastive.yaml).  This sweep runs evaluation for each
# `cohort_fine` diagnosis independently, subsetting subjects by their
# fine-cohort label in the population CSV.
#
# The `training_cohort` field tells the sweep which grouped training
# checkpoint to use when finetuning on a fine-grained cohort.
# The `cohort_fine_col` / `cohort_fine_value` pair filters evaluation to
# only patients whose `cohort_fine` column matches.
#
# Run with:
#   python -m opera.run.sweep --config opera/configs/leukemia_sweep.yaml
#   python -m opera.run.sweep --config opera/configs/leukemia_sweep.yaml --dry-run
# ══════════════════════════════════════════════════════════════════════

output_dir: ${BONSAI_RESULTS_ROOT}/leukemia_sweep
finetune_base_config: opera/configs/finetune.yaml
seeds: [42, 43, 44]

# ── Fine-grained evaluation cohorts ──────────────────────────────────
# Each entry is one `cohort_fine` diagnosis.
#
# data_dir        : points to the GROUPED cohort directory (shared data for
#                   all fine members, e.g. dlbcl_like for DLBCL/BCL/RT/…).
# training_cohort : name key used to look up grouped checkpoints (must match
#                   a cohort key in the contrastive/finetune training configs).
# cohort_fine_col : column in population_full.csv that holds the fine label.
# cohort_fine_value: the specific fine-cohort value to evaluate.
# ipi_score_col   : optional IPI/clinical score column for baseline comparison.
# registry_start_date: optional outcome coverage start.
#
# DLBCL-like group ────────────────────────────────────────────────────
cohorts:
  # ── DLBCL-like ──────────────────────────────────────────────────────
  DLBCL:
    data_dir: ${BONSAI_PROCESSED_DATA}/dlbcl_like
    training_cohort: dlbcl_like
    cohort_fine_col: cohort_fine
    cohort_fine_value: DLBCL
    ipi_score_col: nccn_ipi
    registry_start_date: null

  BCL:
    data_dir: ${BONSAI_PROCESSED_DATA}/dlbcl_like
    training_cohort: dlbcl_like
    cohort_fine_col: cohort_fine
    cohort_fine_value: BCL
    ipi_score_col: null
    registry_start_date: null

  RT:
    data_dir: ${BONSAI_PROCESSED_DATA}/dlbcl_like
    training_cohort: dlbcl_like
    cohort_fine_col: cohort_fine
    cohort_fine_value: RT
    ipi_score_col: null
    registry_start_date: null

  RT_DERIVED:
