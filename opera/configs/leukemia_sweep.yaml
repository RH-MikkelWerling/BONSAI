    training_cohort: indolent_b_nhl
    cohort_fine_col: cohort_fine
    cohort_fine_value: MCL
    ipi_score_col: mipi
    registry_start_date: null

  LPL:
    data_dir: ${BONSAI_PROCESSED_DATA}/indolent_b_nhl
    training_cohort: indolent_b_nhl
    cohort_fine_col: cohort_fine
    cohort_fine_value: LPL
    ipi_score_col: null
    registry_start_date: null

  EMZL:
    data_dir: ${BONSAI_PROCESSED_DATA}/indolent_b_nhl
    training_cohort: indolent_b_nhl
    cohort_fine_col: cohort_fine
    cohort_fine_value: EMZL
    ipi_score_col: null
    registry_start_date: null

  NMZL:
