    registry_start_date: null

# ── Outcomes ──────────────────────────────────────────────────────────
outcomes:
  mortality_1y:
    outcome_file: mortality.parquet
    n_hours_start_include: 1
    n_hours_end_include: 8760
    registry_start_date: null
    eligibility_file: mortality__audit.parquet
  mortality_2y:
    outcome_file: mortality.parquet
    n_hours_start_include: 1
    n_hours_end_include: 17520
    registry_start_date: null
    eligibility_file: mortality__audit.parquet
  treatment_failure:
    outcome_file: treatment_failure.parquet
    n_hours_start_include: 1
    n_hours_end_include: null
    registry_start_date: null
    eligibility_file: treatment_failure__audit.parquet

# ── Model variants ────────────────────────────────────────────────────
model_variants:
  # ── Tier 2: Tabular baselines ──────────────────────────────────────
  tabular_rkkp:
    predictions_file: ${BONSAI_RESULTS_ROOT}/tabular/tabular_rkkp_{cohort}_{outcome}_predictions.csv
    evaluation_regime: fixed_horizon
    exclude_outcomes: [treatment_failure]
  tabular_ehr:
    predictions_file: ${BONSAI_RESULTS_ROOT}/tabular/tabular_ehr_{cohort}_{outcome}_predictions.csv
    evaluation_regime: fixed_horizon
    exclude_outcomes: [treatment_failure]
  tabular_ehr_logistic:
    predictions_file: ${BONSAI_RESULTS_ROOT}/tabular/tabular_ehr_logistic_{cohort}_{outcome}_predictions.csv
    evaluation_regime: fixed_horizon
    exclude_outcomes: [treatment_failure]
  tabular_ehr_xgboost:
    predictions_file: ${BONSAI_RESULTS_ROOT}/tabular/tabular_ehr_xgboost_{cohort}_{outcome}_predictions.csv
    evaluation_regime: fixed_horizon
    exclude_outcomes: [treatment_failure]
  tabular_ehr_tabpfn:
    predictions_file: ${BONSAI_RESULTS_ROOT}/tabular/tabular_ehr_tabpfn_{cohort}_{outcome}_predictions.csv
    evaluation_regime: fixed_horizon
    exclude_outcomes: [treatment_failure]
  tabular_ehr_logistic_ipcw_bce:
    predictions_file: ${BONSAI_RESULTS_ROOT}/tabular/tabular_ehr_logistic_ipcw_bce_{cohort}_{outcome}_predictions.csv
    evaluation_regime: fixed_horizon
    exclude_outcomes: [treatment_failure]
  tabular_ehr_xgboost_ipcw_bce:
    predictions_file: ${BONSAI_RESULTS_ROOT}/tabular/tabular_ehr_xgboost_ipcw_bce_{cohort}_{outcome}_predictions.csv
    evaluation_regime: fixed_horizon
    exclude_outcomes: [treatment_failure]
  tabular_ehr_cox:
    predictions_file: ${BONSAI_RESULTS_ROOT}/tabular/tabular_ehr_cox_{cohort}_{outcome}_predictions.csv
    evaluation_regime: survival
  tabular_ehr_xgboost_aft:
    predictions_file: ${BONSAI_RESULTS_ROOT}/tabular/tabular_ehr_xgboost_aft_{cohort}_{outcome}_predictions.csv
    evaluation_regime: survival

  # ── Tier 3: Foundation model variants ─────────────────────────────
  no_pretraining:
    encoder_source: random_init
    training_stage: no_pretraining_finetune

  base_pretrain:
    encoder_ckpt: ${BONSAI_CHECKPOINT_ROOT}/pretrain/best.ckpt
    encoder_source: pretrain

  hematology_only_pretrain:
    encoder_ckpt: ${BONSAI_CHECKPOINT_ROOT}/hematology_pretrain/best.ckpt
    encoder_source: pretrain
    pretraining_scope: hematology_only

  dapt:
    encoder_ckpt: ${BONSAI_CHECKPOINT_ROOT}/dapt/best.ckpt
    encoder_source: dapt

  # OPERA: joint contrastive encoder trained on cohort_grouped
  opera:
    encoder_ckpt: ${BONSAI_CHECKPOINT_ROOT}/leukemia_contrastive/best.ckpt
    encoder_source: contrastive

  # Per-grouped-cohort contrastive (ablation: single-group contrastive)
  opera_per_grouped:
    encoder_ckpt: ${BONSAI_CHECKPOINT_ROOT}/leukemia_contrastive_per_group/{training_cohort}/best.ckpt
    encoder_source: contrastive
    opera_scope: per_cohort

  # Linear probes (frozen encoder)
  opera_linear_probe:
    encoder_ckpt: ${BONSAI_CHECKPOINT_ROOT}/leukemia_contrastive/best.ckpt
    encoder_source: contrastive
    training_stage: linear_probe
    extra_overrides:
      - model.freeze_encoder=true
      - model.head_type=linear_probe
      - training_stage=linear_probe

  dapt_linear_probe:
    encoder_ckpt: ${BONSAI_CHECKPOINT_ROOT}/dapt/best.ckpt
    encoder_source: dapt
    training_stage: linear_probe
    extra_overrides:
      - model.freeze_encoder=true
      - model.head_type=linear_probe
      - training_stage=linear_probe

  # Survival head variants
  opera_cox:
    encoder_ckpt: ${BONSAI_CHECKPOINT_ROOT}/leukemia_contrastive/best.ckpt
    encoder_source: contrastive
    training_mode: cox

  opera_ipcw_bce:
    encoder_ckpt: ${BONSAI_CHECKPOINT_ROOT}/leukemia_contrastive/best.ckpt
    encoder_source: contrastive
    training_mode: ipcw_bce
    exclude_outcomes: [treatment_failure]

  # Joint multi-task model (one encoder, all grouped cohorts and outcomes)
  opera_joint:
    encoder_ckpt: ${BONSAI_CHECKPOINT_ROOT}/leukemia_joint_finetune/best.ckpt
    encoder_source: joint
