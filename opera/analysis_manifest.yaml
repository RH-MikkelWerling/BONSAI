# OPERA hematology study — current analysis manifest
#
# The canonical cohort and outcome inventory lives in
# opera/configs/experiment_registry.yaml.  This manifest does not remove
# small/underpowered fine cohorts from the raw or rarity-gradient analyses;
# all structurally available cohort–outcome cells remain eligible for them.
version: "2.0"

# The primary comparison is representation-level: joint OPERA against the
# strongest upstream alternatives, evaluated independently within cohort_fine.
primary_endpoints:
  - overall_survival
  - treatment_failure

# Every registry outcome is evaluated in the generated sweeps.  These named
# endpoints are retained as clinically interpretable exploratory summaries;
# they do not define the full task inventory.
exploratory_outcomes:
  - serious_infection_composite
  - severe_cytopenia
  - MACE_composite
  - hospitalisation

primary_contrasts:
  - [no_pretraining, opera]
  - [base_pretrain, opera]
  - [dapt, opera]
  - [multi_outcome, opera]

multiplicity:
  method: benjamini_hochberg
  alpha: 0.05
  family: primary_contrasts_x_primary_endpoints

# Retain every evaluable cell.  Larger-count strata are reported as precision
# tiers by the downstream analysis rather than filtering cells at manifest
# level.
min_events:
  test: 1
  train: 1

seeds: [42, 43, 44]

cohort_analysis:
  primary_level: fine
  grouped_role: secondary_pooled_context
  fine_cohorts:
    - AMYLOIDOSIS
    - BL
    - LBL
    - CLL
    - SLL
    - DLBCL
    - RT
    - TRANSFORMED_FL
    - HCL
    - HL
    - BCL
    - EMZL
    - FL
    - LPL
    - NMZL
    - SMZL
    - MCL
    - MM
    - PCL
    - SolM
    - AITL
    - ALCL
    - PTCL
    - TCL
  grouped_cohorts:
    - AMYLOIDOSIS
    - BL_LBL
    - CLL_SLL
    - DLBCL_like
    - HCL
    - HL
    - Indolent_B_NHL
    - MCL
    - MM
    - T_NHL

# Fine-cohort rarity results are primary as a panel; none are silently omitted
# from aggregation because of cohort size.
confirmatory_fine_cohorts: []

calibration:
  set: held_out
  method: logistic_calibration_curve
  note: "Do not assess calibration on data used to fit the calibrator"
