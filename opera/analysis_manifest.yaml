# OPERA Leukemia Study — Locked Analysis Manifest
# Version: 1.0
# This file encodes the confirmatory analysis plan.
# Changes require a version bump and a scientific review note.
version: "1.0"

# Primary endpoints — outcomes used in confirmatory statistical tests
primary_endpoints:
  - mortality_1y
  - treatment_failure

# Exploratory outcomes — reported but not subject to multiplicity correction
exploratory_outcomes:
  - mortality_2y
  - aki_30d
  - severe_infection_90d

# Model contrasts for primary endpoints (each pair is a pre-specified comparison)
# Format: [reference_model, comparator_model]
primary_contrasts:
  - [base_pretrain, opera]
  - [dapt, opera]
  - [base_pretrain, dapt]
  - [no_pretraining, opera]
  - [tabular_ehr, opera]

# Multiplicity correction
multiplicity:
  method: benjamini_hochberg
  alpha: 0.05
  family: primary_contrasts_x_primary_endpoints  # corrections applied within this family

# Minimum event thresholds for a cell to be included in primary analysis
min_events:
  test: 10         # minimum events in held_out split
  train: 20        # minimum events in train split for model to be trained

# Random seeds (all models trained with each seed; results averaged)
seeds: [42, 43, 44]

# Confirmatory vs exploratory labelling for cohort-level analysis
cohort_analysis:
  confirmatory_grouped:    # grouped cohorts with sufficient events expected
    - DLBCL_like
    - CLL_SLL
    - MM
    - HL
    - Indolent_B_NHL
  exploratory_grouped:     # smaller groups, reported descriptively
    - T_NHL
    - BL_LBL
    - HCL
    - AMYLOIDOSIS
    - SoIM

# Fine-cohort analysis: all fine cohorts are exploratory by default unless listed here
confirmatory_fine_cohorts:
  - DLBCL
  - CLL
  - MM
  - HL

# Calibration: assess on held_out predictions only (no apparent calibration)
calibration:
  set: held_out
  method: logistic_calibration_curve
  note: "Do not assess calibration on data used to fit the calibrator"
