# Clinical groups of codes, used to name and group what the model relies on.
# Diagnosis groups share categories with the outcome definitions, but a display
# group is not a validated endpoint definition. See the Danish code audit in
# docs/DANISH_CODE_AUDIT_20261028.md. Entries are ICD-10 three-character
# categories or ranges of them (SKS form without the leading D), ATC prefixes,
# SKS procedure prefixes or NPU codes. The longest matching entry wins.
# Status: draft for clinical review (mark reviewed in the analysis config).
diagnoses:
  Sepsis: [A40, A41]
  Herpes zoster: [B02]
  Selected fungal diagnoses: [B44, B45, B46]
  # Danish B59 closed 2018-12-31; B48.5 applies from 2019-01-01.
  Pneumocystosis: [B59, B485]
  Pneumonia: [J12-J18]
  Hodgkin lymphoma: [C81]
  Non-Hodgkin lymphoma: [C82-C86]
  Malignant immunoproliferative disease: [C88]
  Multiple myeloma and plasma cell neoplasms: [C90]
  Lymphoid leukaemia: [C91]
  Neutropenia: [D70]
  Anaemia: [D50-D64]
  Diabetes: [E10-E14]
  Atrial fibrillation or flutter: [I48]
  Heart failure: [I50]
  Myocardial infarction: [I21, I22]
  Stroke or transient cerebral ischaemic syndromes: [I63, I64, G45]
  Venous thrombosis, thrombophlebitis or pulmonary embolism: [I26, I80, I81, I82]
  Hypertension: [I10-I15]
  Chronic obstructive pulmonary disease: [J44]
  Acute kidney injury: [N17]
  Chronic kidney disease: [N18]
  Fracture: [S02, S12, S22, S32, S42, S52, S62, S72, S82, S92, T02, M80]
medication:
  Systemic antibacterials: [J01]
  Systemic antimycotics: [J02]
  Systemic antivirals: [J05]
  Antineoplastics: [L01]
  Immunosuppressants: [L04]
  Colony stimulating factors: [L03AA]
  Systemic corticosteroids: [H02A, H02B]
  Antiadrenal preparations: [H02C]
  Antithrombotics: [B01]
  Diuretics: [C03]
  Insulins and analogues: [A10A]
  Opioids: [N02A]
procedures:
  Blood transfusion: [BOQA]
  Platelet transfusion: [BOQC]
  Respiratory support: [BGDA0, BGDA1, BGDA2, BGDA7]
