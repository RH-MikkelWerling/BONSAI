name: 'Pipeline test'

on:
    workflow_dispatch:
    pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  BONSAI_CONFIG_PATH: "${{ github.workspace }}/configs"
  BONSAI_MODELS: "${{ github.workspace }}/.ci/models"
  BONSAI_PROCESSED_DATA: "${{ github.workspace }}/.ci/processed"
  BONSAI_PREDICTIONS: "${{ github.workspace }}/.ci/predictions"
  CKPT_PATH: "${{ github.workspace }}/.ci/models/correlated_MEDS_data/examples/example_pretrain/run_id_0/version_0/best.ckpt"
  HYDRA_FULL_ERROR: 1
  MPLBACKEND: Agg

jobs:
    pipeline_tests:
        runs-on: "ubuntu-latest"
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'
                cache: 'pip' 
                cache-dependency-path: 'pyproject.toml'

            - name: Install Dependencies
              run: python -m pip install -c requirements/constraints-ci.txt -e ".[dev]"

            - name: create_data
              run: python -m bonsai.run.create_data --config-name examples/example_data dataset=correlated_MEDS_data

            - name: create_outcome
              run: python -m bonsai.run.create_outcome --config-name examples/example_outcome1 dataset=correlated_MEDS_data

            - name: pretrain
              run: python -m bonsai.run.pretrain --config-name examples/example_pretrain dataset=correlated_MEDS_data hardware.accelerator=cpu hardware.num_workers=0 hardware.compile_mode=null hardware.precision=32-true training.epochs=1 run_id=0

            - name: finetune
              run: python -m bonsai.run.finetune --config-name examples/example_finetune dataset=correlated_MEDS_data outcome=examples/example_outcome1 pretrain_path=$CKPT_PATH hardware.compile_mode=null hardware.precision=32-true training.epochs=1 run_id=1

            - name: train (no pretrain path)
              run: python -m bonsai.run.train --config-name examples/example_finetune dataset=correlated_MEDS_data outcome=examples/example_outcome1 hardware.compile_mode=null hardware.precision=32-true training.epochs=1 run_id=2

