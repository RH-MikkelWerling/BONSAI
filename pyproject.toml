[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai"
version = "2.0.0"
description = "BONSAI and OPERA tooling for EHR representation learning and hematology prediction experiments."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Sebastian Llambias", email = "snl@di.ku.dk" },
    { name = "Mikkel Odgaard" },
    { name = "Maria Elkjær Montgomery" },
    { name = "Kiril Klein" },
    { name = "Stephan Sloth Lorenzen" },
]
keywords = ["EHR", "transformers", "healthcare", "machine learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
    "numpy>=1.26,<3",
    "lightning>=2.5,<3",
    "hydra-core>=1.3.2",
    "pandas>=2.2,<4",
    "polars>=1.20.0",
    "pyarrow>=15.0.0",
    "PyYAML>=6.0.3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.11.0",
    "torch>=2.5,<3",
    "torchmetrics>=1.6.0",
    "tqdm>=4.66.0",
    "transformers>=4.48.2,<5",
    "matplotlib>=3.9.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
include = ["bonsai", "bonsai.*", "opera", "opera.*"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff==0.15.1",
    "docstr-coverage",
    "coverage>=7",
]
tabular = [
    "xgboost>=2.0",
]
visualization = [
    "adjustText>=1.0.0",
    "pacmap>=0.7.0",
    "statsmodels>=0.14.0",
    "umap-learn>=0.5.0",
]
survival = [
    "lifelines>=0.30.0",
]
retrieval = [
    "faiss-cpu>=1.8.0",
]
tabpfn = [
    "tabpfn",
]

[project.urls]
Homepage = "https://github.com/FGA-DIKU/BONSAI"
Source = "https://github.com/FGA-DIKU/BONSAI"
Tracker = "https://github.com/FGA-DIKU/BONSAI/issues"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
    "smoke: fast deterministic unit tests (< 1s each)",
    "integration: tests that require heavy fixtures or run subprocesses",
    "slow: tests that take more than 5 seconds",
]

[tool.ruff]
target-version = "py312"

[tool.coverage.run]
source = ["bonsai", "opera"]

[tool.coverage.report]
fail_under = 44
show_missing = true
skip_covered = true
