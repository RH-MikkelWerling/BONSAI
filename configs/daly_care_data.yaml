# @package _global_
# Production conversion of ehr2meds' ready-to-ingest DALY-CARE output.
defaults:
  - data_creation/default_create_data@
  - _self_

dataset: daly_care

paths:
  input_dir: ${oc.env:EHR2MEDS_OUTPUT}
  output_dir: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}

# Consume ehr2meds' train-fitted numeric_value_normalized on the original,
# unsuffixed concept row. The ehr2meds pipeline must omit join_numeric_bins.
numeric_value_mode: continuous

# Vocabulary fitting uses only physical SSL-train subjects and pre-2022 events.
vocabulary_cutoff_date:
  year: 2022
  month: 1
  day: 1

splits:
  - train
  - tuning

exclude_regex: null

tokenizer:
  vocabulary: null
  cutoffs: null
  sep_tokens: true
