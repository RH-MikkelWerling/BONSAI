# @package _global_
# Paper representation: ehr2meds' joined laboratory tokens
# (LABTEST//<NPU>//BIN_<k>, LABTEST//<NPU>//<text>) read as ordinary codes.
# The pipeline must run annotate_numeric_values, join_numeric_bins and
# join_lab_text_values (configs/MEDS/phair_lymphoma_pipeline.yaml does).
# joined_binning drops every numeric payload column, so the encoder
# (value_bin_vocab_size: 0) reads the joined code only and no value is encoded
# twice. The national extract is tokenised the same way.
#
# Name each release, so earlier processed data are never overwritten:
#   python -m bonsai.run.create_data --config-name daly_care_joined_bins_data \
#     dataset=daly_care_t100_joined_bins_<release>
defaults:
  - data_creation/default_create_data@
  - _self_

dataset: daly_care_joined_bins

paths:
  input_dir: ${oc.env:EHR2MEDS_OUTPUT}
  output_dir: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}

numeric_value_mode: joined_binning

# Vocabulary fitting uses only physical SSL-train subjects and pre-2022 events.
vocabulary_cutoff_date:
  year: 2022
  month: 1
  day: 1

splits:
  - train
  - tuning

exclude_regex: null

tokenizer:
  vocabulary: null
  cutoffs: null
  sep_tokens: true
