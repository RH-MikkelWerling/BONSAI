defaults:
  - core/base_create@
  - _self_
  
splits: 
  - train
  - tuning
  - held_out

dataset: 

paths: 
  input_dir: example_data/${dataset}
  output_dir: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}

exclude_regex: 

# Paper-aligned sequence construction: numeric event -> event, [VAL].
# Has no effect when the ehr2meds numeric columns are absent.
numeric_value_mode: combined_binning

tokenizer:
  vocabulary:
  cutoffs:
  sep_tokens: true
